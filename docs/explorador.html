const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const recorta=(s,n)=>{s=String(s??"");return s.length>n?s.slice(0,n-1).trimEnd()+"…":s;};

/* Markdown mínimo y seguro: se escapa TODO primero y solo después se dan
   formato a las marcas, así ningún texto del paquete llega como HTML. */
function mdEnLinea(t,base){
  let s=esc(t);
  const codigos=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codigos.push(c);return "\u0000"+(codigos.length-1)+"\u0000";});
  s=s.replace(/&lt;br\s*\/?&gt;/gi,"<br>");
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,url)=>{
    const href=enlace(url,base);
    return href?`<a class="lnk" href="${href}" target="_blank" rel="noopener">${txt}</a>`:txt;
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,"$1<em>$2</em>").replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g,"$1<em>$2</em>");
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${codigos[+i]}</code>`);
  return s;
}
/* Enlaces: http(s), mailto o rutas relativas al documento (se resuelven contra
   docs/, donde vive esta página). Nada de javascript: ni data:. Acepta la url
   escapada (desde mdEnLinea) o en claro, y la devuelve escapada para un atributo. */
function enlace(url,base){
  const u=String(url).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
  if(/^(https?:|mailto:)/i.test(u)) return esc(u);
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return null;
  if(u.startsWith("#")) return null;
  const partes=(base?base.split("/").slice(0,-1):[]).concat(u.split("/"));
  const r=[];
  for(const p of partes){ if(p===""||p===".") continue; if(p==="..") r.pop(); else r.push(p); }
  return esc(r.join("/"));
}
function celdas(l){
  let s=l.trim(); if(s.startsWith("|")) s=s.slice(1); if(s.endsWith("|")&&!s.endsWith("\\|")) s=s.slice(0,-1);
  const out=[]; let c="", cod=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(ch==="\\"&&s[i+1]==="|"){c+="|";i++;continue;}
    if(ch==="`") cod=!cod;
    if(ch==="|"&&!cod){out.push(c.trim());c="";continue;}
    c+=ch;}
  out.push(c.trim()); return out;
}

    if((m=l.match(/^\s*(```|~~~)/))){
      const cierre=m[1]; const b=[]; i++;
      while(i<L.length&&!L[i].trim().startsWith(cierre)){b.push(L[i]);i++;}
      i++; h+=`<pre><code>${esc(b.join("\n"))}</code></pre>`; continue;
    }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){const n=Math.min(6,m[1].length+2);h+=`<h${n}>${mdEnLinea(m[2].replace(/\s#+$/,""),base)}</h${n}>`;i++;continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){h+="<hr>";i++;continue;}
    if(l.trim().startsWith("|")&&i+1<L.length&&esSep(L[i+1])){
      const cab=celdas(l); i+=2; const filas=[];
      while(i<L.length&&L[i].trim().startsWith("|")){filas.push(celdas(L[i]));i++;}
      h+=`<div class="tabla"><table><thead><tr>${cab.map(c=>`<th>${mdEnLinea(c,base)}</th>`).join("")}</tr></thead><tbody>${
        filas.map(f=>`<tr>${cab.map((_,k)=>`<td>${mdEnLinea(f[k]??"",base)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(l.trim().startsWith("|")){
      const filas=[]; while(i<L.length&&L[i].trim().startsWith("|")){if(!esSep(L[i])) filas.push(celdas(L[i]));i++;}
      h+=`<div class="tabla"><table><tbody>${filas.map(f=>`<tr>${f.map(c=>`<td>${mdEnLinea(c,base)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,""));i++;}
      h+=`<blockquote>${md(b.join("\n"),base)}</blockquote>`;continue;}
    if(esLista(l)){
      const ord=/^\s*\d+[.)]\s+/.test(l); const items=[];
      while(i<L.length&&(esLista(L[i])||(/^\s{2,}\S/.test(L[i])&&items.length))){
        if(esLista(L[i])) items.push(L[i].replace(/^\s*([-*+]|\d+[.)])\s+/,""));
        else items[items.length-1]+=" "+L[i].trim();
        i++;
      }
      const tag=ord?"ol":"ul";
      h+=`<${tag}>${items.map(x=>`<li>${mdEnLinea(x.replace(/^\[( |x|X)\]\s+/,(m,c)=>c===" "?"☐ ":"☑ "),base)}</li>`).join("")}</${tag}>`;
      continue;
    }
    const p=[];
    while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,6})\s/.test(L[i])&&!/^\s*(```|~~~)/.test(L[i])&&!L[i].trim().startsWith("|")&&!/^\s*>/.test(L[i])&&!(esLista(L[i])&&p.length===0)){
      if(esLista(L[i])) break;
      p.push(L[i].trim()); i++;
    }
    if(p.length) h+=`<p>${mdEnLinea(p.join(" "),base)}</p>`; else i++;
  }
  return h;
}

});

/* ===================== estado y filtros ===================== */
let modo=FLUJOS.length?"flujos":"fts", filtro="todo", q="", sel=null;
function filtrosFts(){
  const r=[["todo","Todas"]];
  const prios=["Debe tener","Debería tener","Podría tener","No esta vez"].filter(p=>F.some(f=>f.prioridad===p));
  prios.forEach(p=>r.push(["p:"+p,p]));
  if(F.some(f=>f.dor?.veredicto==="READY")) r.push(["lista","Listas"]);
  if(F.some(f=>f.dor?.veredicto==="READY CON CONDICIONES")) r.push(["cond","Con condiciones"]);
  if(F.some(f=>!puedeEmpezar(f))) r.push(["nolista","No listas o sin DoR"]);
  if(F.some(f=>f._abiertos)) r.push(["frenada","Con bloqueantes abiertos"]);
  if(F.some(f=>f.ui)) r.push(["ui","Con pantallas"]);
  return r;
}
const FILTROS={flujos:[["todo","Todos"],["listo","Todo puede empezar"],["frenado","Con algo sin decidir"]], fts:filtrosFts()};

function pintaModo(){ $$("#modo button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.m===modo))); }
function pintaFiltros(){
  const fs=modo==="flujos"&&!FLUJOS.length?[]:FILTROS[modo];
  $("#filtros").innerHTML=fs.map(([k,n])=>`<button type="button" class="f" data-f="${esc(k)}" aria-pressed="${k===filtro}">${esc(n)}</button>`).join("")+`<span id="cuenta"></span>`;
  $$(".f").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;pintaFiltros();pintaLista();});
}
function pasaFl(fl){
  if(q && !fl._busca.includes(q)) return false;
  if(filtro==="listo") return fl._total>0&&fl._listas===fl._total;
  if(filtro==="frenado") return fl._fallas>0;
  return true;
}
function pasaFt(f){
  if(q && !f._busca.includes(q)) return false;
  if(filtro.startsWith("p:")) return f.prioridad===filtro.slice(2);
  if(filtro==="lista") return f.dor?.veredicto==="READY";
  if(filtro==="cond") return f.dor?.veredicto==="READY CON CONDICIONES";
  if(filtro==="nolista") return !puedeEmpezar(f);
  if(filtro==="frenada") return f._abiertos>0;
  if(filtro==="ui") return !!f.ui;
  return true;
}

  <div class="dh">
    ${enFlujos.length?`<button type="button" class="volver" data-fl="${esc(enFlujos[0].id)}">← Volver al flujo «${esc(enFlujos[0].nombre)}»</button><br>`:""}
    <div class="bc">${f.epica?esc(f.epica)+" · "+esc((EP[f.epica]||{}).titulo||""):"Sin épica"}</div>
    <h2>${esc(f.nombre)}</h2>
    <div class="meta">
      <span class="tag t-capa">${esc(f.id)}</span>
      ${f.prioridad?`<span class="tag ${tagPrio(f.prioridad)}">${esc(f.prioridad)}</span>`:""}
      ${f.release?`<span class="tag t-capa" title="${esc(f.release)}">${esc(recorta(f.release,60))}</span>`:""}
      ${f.estado?`<span class="tag t-podria">documento ${esc(f.estado)}</span>`:""}
      ${f.ui?'<span class="tag t-capa">Con pantallas</span>':""}
      <span class="tag ${v.c}">${esc(v.largo)}${f.dor?.origen==="propuesta-ia"?" (propuesta IA)":""}</span>
    </div>
  </div>
  ${enFlujos.length?`<section class="blk"><h3><span class="num">·</span>EN QUÉ FLUJOS APARECE</h3>
    <div class="chips">${enFlujos.map(fl=>`<button type="button" class="chip" data-fl="${esc(fl.id)}">${esc(fl.nombre)}</button>`).join("")}</div></section>`:""}
  <section class="blk">
    <h3><span class="num">${++n}</span>QUÉ SE VA A HACER · NEGOCIO</h3>
    ${f.secciones?.length?secciones(f.secciones,f.archivo,2):`<p class="txt">La feature no tiene texto todavía.</p>`}
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>CÓMO SE VA A HACER · TÉCNICO</h3>
    <div class="cards">
      <div class="card"><h4>DATOS QUE TOCA</h4>${f.entidades.length?`<div class="chips">${f.entidades.map(e=>`<span class="chip">${esc(e)}</span>`).join("")}</div>`:`<p class="txt">Ninguna entidad de <code>datos/</code> citada.</p>`}</div>
      <div class="card"><h4>POR DÓNDE SE LLAMA</h4>${f.endpoints.length?`<div class="chips">${f.endpoints.slice(0,12).map(e=>`<span class="chip e">${esc(e)}</span>`).join("")}</div>${f.endpoints.length>12?`<p class="nota">y ${f.endpoints.length-12} más</p>`:""}`:`<p class="txt">Sin rutas citadas todavía: entran con el contrato de API (G3).</p>`}</div>
      <div class="card"><h4>DECISIONES QUE LA SOSTIENEN</h4>${f.adrs.length?`<div class="chips">${f.adrs.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>`:`<p class="txt">Ningún ADR citado.</p>`}</div>
    </div>
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>CUÁNTO TRABAJO ES</h3>
    <div class="cards">
      <div class="card"><h4>HISTORIAS</h4><div class="v">${f.hus.length}</div></div>
      <div class="card"><h4>CRITERIOS</h4><div class="v">${f._crit}</div></div>
      <div class="card"><h4>TAREAS</h4><div class="v">${f._tareas}${horasTxt?` <small>${esc(horasTxt)}</small>`:""}</div></div>
      <div class="card"><h4>CASOS DE PRUEBA</h4><div class="v">${f._casos}</div></div>
    </div>
    <h4 class="sub">LAS HISTORIAS, UNA A UNA</h4>
    ${hus||`<p class="txt">Ninguna historia la cita como suya todavía.</p>`}
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>QUÉ LA FRENA</h3>
    ${!f.dor?`<p class="txt">No tiene DoR (<code>dor/DOR-${esc(f.id)}…md</code>): nadie ha evaluado todavía si puede entrar a desarrollo.</p>`
      :`<p class="txt">${f.dor.veredicto?(f.dor.origen==="propuesta-ia"
          ?`Su DoR trae una <strong>propuesta de la IA: ${esc(f.dor.veredicto)}</strong>. Lo decide el PO, y todavía no lo ha hecho.`
          :`El PO la declaró <strong>${esc(f.dor.veredicto)}</strong>.`):"Su DoR no tiene veredicto todavía."}</p>`}
    ${bl.length?`<div class="tabla"><table>
      <thead><tr><th style="width:92px">Qué</th><th>De qué se trata</th><th style="width:96px">Dueño</th><th style="width:102px">Fecha</th><th style="width:110px">Estado</th></tr></thead>
      <tbody>${bl.map(b=>`<tr><td class="k">${esc(b.id)}</td><td>${mdEnLinea(recorta(b.que,320),f.dor.archivo)}</td><td>${esc(b.dueno||"—")}</td><td>${esc(b.fecha||"—")}</td>
        <td><span style="font:600 11px var(--mono);color:${abierto(b)?"var(--carmine)":"var(--green)"}">${esc(b.estado||"—")}</span></td></tr>`).join("")}</tbody></table></div>
      <p class="nota">${f._abiertos} de ${bl.length} siguen abiertos. Una fecha «requerida» no es una fecha comprometida por su dueño.</p>`
      :f.dor?`<p class="txt">Su DoR no lista bloqueantes ni dependencias.</p>`:""}
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>DÓNDE LEER MÁS</h3>
    <div class="chips"><a class="chip e" href="${enlace(f.archivo,"")}" target="_blank" rel="noopener">${esc(f.archivo)}</a>${
      f.hus.filter(h=>HU[h]).map(h=>`<a class="chip e" href="${enlace(HU[h].archivo,"")}" target="_blank" rel="noopener">${esc(HU[h].archivo)}</a>`).join("")}${
      f.dor?`<a class="chip e" href="${enlace(f.dor.archivo,"")}" target="_blank" rel="noopener">${esc(f.dor.archivo)}</a>`:""}</div>
  </section>
  <div class="pie">${pie()}</div>`;
  enlaza(); $("#detalle").scrollTop=0;
}

function pie(){
  return `Generado por <code>aybar paquete explorador</code> desde el <code>docs/</code> del servicio${CAB.fecha?", con documentos hasta el "+esc(CAB.fecha):""}. No se edita a mano: se regenera.`;
}

/* ===================== arranque ===================== */
$$("#modo button").forEach(b=>b.onclick=()=>cambiaModo(b.dataset.m));
$("#buscar").oninput=e=>{q=e.target.value.trim().toLowerCase();pintaLista();};
pintaModo(); pintaFiltros(); pintaLista();
(function(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  const m=h.match(/^(flujo|ft)=(.+)$/); if(!m) return;
  if(m[1]==="flujo"&&FLUJOS.some(x=>x.id===m[2])){ if(modo!=="flujos") cambiaModo("flujos"); abreFlujo(m[2]); }
  else if(m[1]==="ft"&&byId(m[2])){ if(modo!=="fts") cambiaModo("fts"); abreFt(m[2]); }
})();
</script>
</body>
