# Configuracion de los guardianes del marco de entrega Aybar.
#
# Este fichero define los valores POR DEFECTO. Un repositorio que adopte los
# guardianes puede sobreescribir cualquiera creando `.aybar-guardianes.conf`
# en su raiz, con la misma sintaxis (se carga despues de este).
#
# Fuentes: capitulos/03-control-de-versiones.md (3.1, 3.2, 3.4) y
# datos/ejemplos.json (commits.forma).

# Lista cerrada de tipos de commit (3.2). OJO: la lista definitiva es una
# decision pendiente del marco ("fijar la lista cerrada de tipos permitidos",
# 3.2 Consecuencias); esta es la de datos/ejemplos.json y rige hasta que el
# repositorio de workflows publique otra.
TIPOS_PERMITIDOS="feat fix docs refactor test chore perf build ci"

# Identificador de ticket exigido en asunto o cuerpo (3.2). El prefijo AYB- es
# provisional: ninguna fuente declara la nomenclatura del backlog (nota en
# datos/ejemplos.json). Cambiarlo aqui cuando exista la definitiva.
PATRON_TICKET='AYB-[0-9]+'

# Ramas protegidas (3.4): prohibido push directo desde local. La proteccion
# real vive en el servidor; este guardian corta antes y explica por que.
RAMAS_PROTEGIDAS='main master develop release/*'

# Rama por defecto que el pre-push deja CREAR en un remoto que aun no la tiene
# (el primer push del repositorio a un remoto vacio: `git push -u origin main`).
# Solo la creacion: con la rama ya en el remoto, el push directo se corta igual.
RAMA_INICIAL='main'

# Forma de las ramas de trabajo (3.1): feature|bugfix|hotfix/<ID>-<slug>.
PATRON_RAMA_TRABAJO='^(feature|bugfix|hotfix)/[A-Za-z]+-[0-9]+(-[a-z0-9][a-z0-9-]*)?$'

# Largo maximo recomendado de la primera linea. Excederlo AVISA, no bloquea:
# el marco no fija el numero como decision, solo lo usa en ejemplos (3.2).
LARGO_ASUNTO_AVISO=72

# Autores de tipo bot que el modo --rango rechaza (3.3: "el pipeline rechaza
# cualquier commit cuyo autor sea de tipo bot").
PATRON_AUTOR_BOT='\[bot\]|^bot@|-bot@|noreply@github\.com'

# ---------------------------------------------------------------------------
# G4 antes de construir (validar-gate-listo.sh: hook pre-commit, etapa
# "Gates listos" del pipeline y hook de agente). Paquete Definir:
# docs/gates/<TICKET>/G<n>.md con frontmatter YAML; solo estado: approved
# es evidencia.
# ---------------------------------------------------------------------------

# De donde se lee la evidencia, como <remoto>/<rama>. Manda la rama principal
# DEL REMOTO y no la copia local: la aprobacion real es el PR del gate
# mergeado con la revision del CODEOWNER del rol. Un "estado: approved"
# escrito en la rama de trabajo no abre nada hasta que ese PR entra en main.
REF_GATES='origin/main'

# Que cuenta como CODIGO: patrones de `case` relativos a la raiz (`*` cruza
# carpetas). Un cambio que no toca nada de esto (docs/, .agents/, README...)
# no necesita G4: asi se escribe el paquete Definir en la misma rama.
# El frontend (frontend/) tambien es codigo: sus fuentes, lo que publica
# (public/, incluido el registro de remotos de un shell), sus dependencias
# (package.json y el lockfile, como el pom.xml en el backend) y su
# configuracion de build. Su README, Dockerfile y nginx.conf no lo son.
PATRONES_CODIGO='domain/* application/* adapters/* infrastructure/* boot/* pom.xml */pom.xml frontend/src/* frontend/public/* frontend/index.html frontend/package.json frontend/package-lock.json frontend/npm-shrinkwrap.json frontend/pnpm-lock.yaml frontend/yarn.lock frontend/angular.json frontend/aybar.config.json frontend/tsconfig*.json frontend/vite.config.* frontend/vite.*.config.*'

# Ramas exentas del G4 (patrones de `case`):
#   hotfix/  es la via comprimida del marco para un incidente Sev1/Sev2
#            (references/operacion.md, Hotfix): ticket de incidente, fix
#            minimo, CI completo y aprobacion del TL. Esperar un DoR
#            alargaria la caida; el control es otro, no ninguno.
#   bugfix/  correccion planificada de un defecto de algo que ya entro con su
#            G4; su control es el ciclo de QA, no un DoR nuevo.
#   release/ estabiliza lo ya aprobado y es rama protegida: no se trabaja ahi.
RAMAS_EXENTAS_GATE='hotfix/* bugfix/* release/*'

# ---------------------------------------------------------------------------
# Guardianes de agente de IA (.guardianes/agente/, cableados como hooks
# PreToolUse en .claude/settings.json). Contrato de IA (§14): la IA propone,
# el humano aprueba; nunca datos reales de Produccion, PII ni secretos.
# ---------------------------------------------------------------------------

# Que delata Produccion en un comando del agente (ERE, sin distinguir
# mayusculas). El SDK no sabe donde vive la Produccion de cada servicio: por
# defecto reconoce la palabra suelta. Cada servicio AÑADE sus hosts, cuentas,
# suscripciones, proyectos, contextos de kubectl o workspaces reales en su
# .aybar-guardianes.conf, por ejemplo:
#   PATRON_PRODUCCION="$PATRON_PRODUCCION"'|ventas-db\.interno|aks-ventas-pr'
PATRON_PRODUCCION='(^|[^a-z0-9])(prod|production|produccion|prd)([^a-z0-9]|$)'

# Clientes y volcados de datos que el agente no corre contra Produccion (G7).
CLIENTES_DATOS='psql pg_dump mysql mysqldump mariadb mongosh mongo mongodump mongoexport redis-cli sqlcmd bcp sqlplus cqlsh'

# Herramientas de despliegue, nube y acceso remoto que el agente no corre
# contra Produccion (G8: se despliega por pipeline con Release Gate aprobado).
HERRAMIENTAS_INFRA='kubectl helm terraform tofu pulumi serverless sls cdk sam aws az gcloud ssh scp sftp rsync'

# git push del agente:
#   trabajo  publica ramas de trabajo; corta push a protegidas, force-push y
#            --no-verify (lo mismo que los guardianes personales del equipo).
#   nunca    corta todo git push: publica a mano quien lanzo el agente.
PUSH_DEL_AGENTE='trabajo'

# Rutas que el guardian de PII/secretos NO escanea (patrones de `case`
# relativos a la raiz). Vacio a proposito: un test tambien filtra un secreto
# si lleva uno real. Si un servicio necesita excepciones, que sean pocas y
# con nombre, p. ej. 'src/test/resources/claves-sinteticas/*'.
RUTAS_EXENTAS_PII=''
