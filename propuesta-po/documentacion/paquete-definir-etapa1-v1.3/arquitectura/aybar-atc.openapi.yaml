      description: 'Operación del cliente (rol `CUSTOMER`, ADR-011). La identidad del cliente sale solo de su token: es el `PartyID` del cliente autenticado (el token no lo trae: ATC lo obtiene del vínculo de la cuenta en la base única con `CuentaPersonaPort`, ED-01). Admite la cuenta de tipo `CUSTOMER` o el rol `CUSTOMER` y rechaza `PROSPECT`. Ningún identificador de cliente viaja en el cuerpo, la ruta ni la consulta. Solo actúa sobre un ticket de ese cliente (si no, AYB-PTL-404). El cuerpo es `PortalRespuesta` (texto y adjuntos, `additionalProperties: false`): el servidor fija el tipo `CUSTOMER_MESSAGE`, la visibilidad (`IsVisibleToCustomer = true`) y el canal `MI_PORTAL`; un campo de más responde AYB-VAL-400. Si el ticket estaba en PENDING_CUSTOMER, vuelve a IN_PROGRESS y el SLA se reanuda (HU-066 CA-01).'
