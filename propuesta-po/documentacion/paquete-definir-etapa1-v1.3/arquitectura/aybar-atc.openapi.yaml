openapi: 3.0.3
info:
  title: Aybar Atiende · Plataforma ATC
  version: 0.2.0-borrador
  description: |
    BORRADOR del contrato de API (criterio de G3). Estado: draft. Generado el 2026-10-19 a partir de las 62 historias del PLT-04 v1.3 (en refinamiento).
    Es una PROPUESTA de operaciones por módulo: los campos de cada esquema los completa el desarrollador backend con el modelo de datos aprobado.
    Revisión del 20-oct: los campos de clave siguen los nombres del Modelo de Datos Corporativo v7 (cada propiedad dice cuál); los ids del v7 son enteros y el contrato los expone como cadenas opacas hasta que G3 decida. Tipos, largos y obligatoriedad de los demás atributos siguen pendientes.
    Revisión del 21-oct (versión base v4 de Jesús Chávez Elías en Nexora; actualizada por Brayan con IA a la v1.3 del PO): los esquemas que estaban vacíos se completan solo con campos que salen del PO (PLT-03, PLT-04 y PLT-05 v1.3), del Excel del PO (02_RF_Micro, 03_RNF y 05_Catalogos) y del diccionario de datos; cada propiedad cita su fuente. Lo que todavía no está definido lleva `x-pendiente`. El estado del ticket y el de la apelación usan los códigos de las listas del Excel (`SVC_TICKET_STATUS` y `SVC_COMPLAINT_APPEAL_STATUS`). La clave foránea del ticket a PARTY frente al ADR-03 del PO es un conflicto abierto que decide el líder técnico.
    Generado por IA — Revisado por: (pendiente).
    No incluye WebSocket: el visor 3D recibe eventos en tiempo real por `/ws/visor` (ADR-010), que OpenAPI no describe.
    Errores: RFC 7807 con `codigo` (formato AYB-SVC-HTTP del SDK), `correlationId`, `timestamp` y `campos` (aybar-starter-web, que hay que encender: `aybar add starter web`). Cada operación declara 400, 401, 403, 404, 429 y 500; las de negocio (409 y 422) se declaran donde un criterio de aceptación las pide.
    Versionado: `/api/v1`; un cambio incompatible crea `/api/v2` y vuelve a G3. Compatibilidad: por declarar.
servers:
  - url: http://localhost:8081
    description: local
security:
  - bearer-jwt: []
tags:
  - name: tickets
  - name: sla
  - name: bandeja
  - name: libro
  - name: consulta360
  - name: portal
  - name: casos_legales
  - name: postventa
  - name: morosidad
paths:
  /api/v1/tickets:
    post:
      tags: [tickets]
      operationId: registrarTicket
      summary: "Registrar un ticket tipificado desde cualquier canal y entregar su número por razón social (cliente identificado o interesado con datos mínimos)"
