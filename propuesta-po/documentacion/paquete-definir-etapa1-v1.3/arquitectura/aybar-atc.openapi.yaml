      x-decision: "Contrato de ATC para la consulta del cliente (ADR-004): lo implementa el adaptador de SIGDA/TAXON (DEP-01) y, mientras tanto, su simulador. Devuelve el PartyID de la base única junto con los datos de pantalla, que no se guardan (ED-05). Lo que ve cada rol: `roles-y-permisos-atc.md` §8 (Q-050-2)."
      properties:
        clienteId: { type: string, description: 'PartyID.' }
        nombres: { type: string, description: 'PLT-04 §6.5 «Party (SIGDA): Documento, Nombres».' }
        documentoParcial: { type: string, description: 'DNI parcial para elegir entre varias coincidencias (HU-049 CA-03).' }
        lotes: { type: array, items: { type: string }, description: 'Lotes del cliente (HU-049 CA-01 y CA-03).' }
        tickets: { type: array, items: { type: string }, description: 'Números de sus tickets (HU-049 CA-01).' }
    PaginaClientes:
      type: object
      description: "Página de clientes encontrados (HU-049): solo lo que el rol puede ver y sin copiar el dato (RN-SVC-036; ADR-003)."
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/ClienteEncontrado' } }
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
    Consulta360:
      type: object
      description: "Consulta 360 federada en línea, sin copiar el dato (HU-050; ADR-003): una sección por fuente con su estado; si una fuente falla, las demás cargan (CA-03)."
      x-decision: "Fuentes por sección (Q-050-1): SIGDA/TAXON (cliente, DNI y KYC, lotes; DEP-01), Cobranza (cuotas y estado de cuenta; DEP-08), Contratos y Activos (DEP-07), correo, repositorio documental (DEP-06), motor de José (DEP-13), call center (DEP-11) y tickets de ATC. Por rol (Q-050-2): «Estado de cuenta» solo ATC_SUPERVISOR, ATC_LEGAL y ATC_CASES_DESK; «Exposición legal» solo ATC_LEGAL y ATC_CASES_DESK; el resto, todos los roles con ATC.CUSTOMER360 + ver. Estado de la sección: AVAILABLE, RESTRICTED o UNAVAILABLE."
      properties:
