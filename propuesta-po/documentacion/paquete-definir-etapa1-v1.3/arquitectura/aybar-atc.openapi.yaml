openapi: 3.0.3
info:
  title: Aybar Atiende · Plataforma ATC
  version: 0.6.0-borrador
  license:
    name: Uso interno de Aybar (propietario)
  description: |
    BORRADOR del contrato de API (criterio de G3). Estado: draft. Generado el 2026-10-19 a partir de las 62 historias del PLT-04 v1.3; revisado el 20, 21, 22 y 26-oct.
    Campos: los de clave siguen los nombres del Modelo de Datos Corporativo v7 (cada propiedad dice cuál; los ids del v7 son enteros y el contrato los expone como cadenas opacas). Los demás salen del PO (PLT-03, PLT-04 y PLT-05 v1.3), del Excel del PO (02_RF_Micro, 03_RNF y 05_Catalogos) y del diccionario de datos, con su fuente. Lo que las fuentes no definían lo decidió el equipo el 26-oct (`analisis/decisiones.md` v0.7, ED-01 a ED-27) y va en `x-decision`, con la decisión y su fuente; el contrato ya no tiene `x-pendiente`. Tipos, largos y nulabilidad de los atributos no clave: ED-16 (`datos/diccionario.md`). Todos los esquemas tienen sus propiedades.
    Seguridad (ADR-009, ADR-014; `arquitectura/seguridad.md`): JWT del servidor de autorización de Control de acceso (PJ-05). ATC valida firma, emisor, vencimiento y audiencia con `aybar-starter-security`; Azure API Management también valida la audiencia en el borde (D-44 de PJ-05). La audiencia es `aybar-atc` (`AYBAR_JWT_AUDIENCE`; ED-06). ATC no tiene login, no emite códigos y no abre sesiones: no hay operaciones de código ni de sesión de Mi Portal (DT-04; se retiraron `solicitarCodigo` y `abrirSesion` el 22-oct).
    Permisos (C-02; `arquitectura/roles-y-permisos-atc.md`): cada operación declara `x-permiso`, el permiso del catálogo que ATC entrega a Control de acceso, con la forma `<opción> + <acción>` que usa PJ-05 (acciones ver, crear, editar, eliminar y aprobar), y `x-roles`, los roles que exige `@PreAuthorize(hasAnyRole(...))`. El token trae roles, no permisos (ADR-012 y ADR-007 de PJ-05): ATC autoriza por rol con `@PreAuthorize` y no consulta el permiso efectivo en cada operación; la consola usa `GET /api/v1/mi/permisos/{codigoOpcion}` de Control de acceso solo para mostrar u ocultar acciones (ED-02). El catálogo lo aprueba Control de acceso (firma del área; ED-07). El tablero declara además `x-permiso-adicional` y `x-roles-adicional` para la parte del equipo.
    Errores (DT-09, C-10): ProblemDetail RFC 7807 de `aybar-starter-web` (esquema `ProblemaAybar`: `codigo` con el formato `AYB-<ÁREA>-<HTTP>`, `correlationId`, `timestamp` y `campos`). Los de plataforma los emite el SDK (`AYB-VAL-400`, `AYB-SEG-401`, `AYB-SEG-403`, `AYB-REC-404`, `AYB-GEN-429`, `AYB-GEN-500`); los de seguridad (401, 403, falta de rol) los emiten el SDK y Control de acceso con sus códigos y ATC no los reinventa ni emite `AYB-PEF-403` (área de Control de acceso, D-169). Los de negocio de ATC se lanzan con `AybarException` y usan solo las áreas `TKT`, `SLA`, `LRC`, `APL`, `GAR` y `PTL` (`x-areas-de-error`); cada operación que tiene uno lo lista en `x-errores-negocio`.
    Versionado y compatibilidad: la versión mayor va en la ruta (`/api/v1`). Mientras el contrato es borrador, `info.version` es `0.MENOR.PARCHE-borrador`; al aprobarse en G3 pasa a `1.0.0`, y desde ahí su MAYOR es la de la ruta. Dentro de `/api/v1` solo se agregan operaciones y campos opcionales (sube la MENOR) o se corrigen descripciones (sube el PARCHE). Quitar o renombrar una operación o un campo, cambiar un tipo o volver obligatorio un campo es incompatible: crea `/api/v2` (sube la MAYOR) y vuelve a G3. `/api/v1` y `/api/v2` conviven en el mismo despliegue; la operación de v1 que tiene reemplazo se marca `deprecated: true` y se retira cuando sus clientes migraron (consola ATC, Mi Portal y formularios, que son de ATC) y no antes de 90 días (decisión del equipo, propuesta al Líder Técnico en este envío).
    Estados: el del ticket y el de la apelación usan los códigos de las listas del Excel (`SVC_TICKET_STATUS` y `SVC_COMPLAINT_APPEAL_STATUS`). Cliente: `PARTY` de la base única es la fuente viva y la clave foránea del ticket no es una copia (DT-06); la diferencia con el ADR-03 del PO está listada en ED-19. La consulta del cliente devuelve su `PartyID` (contrato de ATC con SIGDA/TAXON, ED-05).
    Mi Portal (ADR-011, decisión 8): sus operaciones usan esquemas propios (`PortalTicketNuevo`, `PortalRespuesta`, `PortalTicket`, `PortalTicketResumen`, `PortalPaginaTickets`, `PortalTrazabilidad` y `PortalInteraccion`). La identidad del cliente sale solo de su token: ATC obtiene su `PartyID` del vínculo de la cuenta en la base única (`IDN_USER_ACCOUNT`, en solo lectura y por columna; `CuentaPersonaPort`, ED-01). `@PreAuthorize` exige un usuario autenticado sin el rol `PROSPECT`, y el caso de uso admite la cuenta de tipo `CUSTOMER` o el rol `CUSTOMER`. Ninguna operación de Mi Portal recibe un identificador de cliente, y los esquemas de entrada declaran `additionalProperties: false` (un campo de más responde AYB-VAL-400). Las respuestas no llevan `PartyID`, prioridad, responsable, creador, conflicto, eje, rayo, flujo ni notas internas. Los esquemas de la consola (`TicketNuevo`, `Ticket`, `TicketResumen`, `Interaccion`) no se usan en Mi Portal.
    Identificadores de colaborador: `colaboradorId`, `gestorId`, `responsableId` y `destinatarioId` son el `PartyID` del colaborador, como las columnas `*PartyID` del v7 (no el `user_account_id` del token: ATC lo traduce con `CuentaPersonaPort`, ED-01). Los gestores que se ofrecen para elegir son los de la cola (ED-03).
    No incluye WebSocket: el visor 3D recibe los eventos del servicio por `/ws/visor` (ADR-010), que OpenAPI no describe. Exige el mismo permiso que `estadoVisor`. El JWT va en la cabecera `Sec-WebSocket-Protocol` (`aybar.visor.v1`, <jwt>), nunca en la URL, y el servicio lo valida en el handshake con `aybar-starter-security` (firma, emisor, vencimiento y audiencia). Al vencer el token, el servidor cierra con el código 4401 y el visor se reconecta. Entra por Cloudflare al ingreso de Container Apps, sin API Management.
    Generado por IA — Revisado por: (pendiente).
  x-historial:
    - '2026-10-19 · Jesús Chávez Elías, con IA · Borrador de operaciones por módulo a partir de las 62 historias.'
    - '2026-10-20 · Equipo, con IA · Campos de clave con los nombres del Modelo de Datos Corporativo v7.'
    - '2026-10-21 · Brayan, con IA · Esquemas completados con fuentes del PO y del Excel; x-pendiente para lo que falta.'
    - '0.3.0 · 2026-10-22 · Jesús Chávez Elías, con IA · Sin operaciones de código y sesión de Mi Portal (DT-04), x-permiso por operación (C-02), etiquetas en inglés.'
    - '0.5.0 · 2026-10-26 · Brayan Hurtado, con IA · Segunda revisión del Líder Técnico: esquemas propios de Mi Portal sin identificador de cliente ni datos internos (additionalProperties: false en la entrada; AYB-PTL-404 y AYB-PTL-422 donde corresponde); Reserva sin clienteId; colaboradorId y gestorId declarados como PartyID; WebSocket del visor autenticado en el handshake; la visibilidad del cliente citada por los criterios de HU-064 a 066.'
    - '0.4.0 · 2026-10-26 · Brayan Hurtado, con IA · x-permiso con la forma de PJ-05 (opción + acción) y x-roles por operación; respuestas de error del SDK por código; x-errores-negocio con las áreas TKT, SLA, LRC, APL, GAR y PTL; ProblemaAybar igual al del SDK; política de compatibilidad con convivencia v1/v2; Mi Portal sin PartyID en el token (P-033); sin descripciones «por completar».'
    - '0.6.0-borrador · 2026-10-26 · Brayan Hurtado, con IA · Decisiones del equipo (ED-01 a ED-27 de `analisis/decisiones.md` v0.7): PartyID del cliente y del colaborador por `CuentaPersonaPort` (ED-01); autorización por rol (ED-02); audiencia `aybar-atc` (ED-06); interesado «sin cliente vinculado» con sus datos mínimos en `SVC_TICKET_PROSPECT` (ED-05); gestores de la cola (ED-03). Los `x-pendiente` pasan a `x-decision` con su decisión y fuente: listas de SERVICE (estado del asiento, instancia de apelación, motivos `REASSIGNMENT_TERMINATION` y `REASSIGNMENT_WORKLOAD`, `CALL`), columnas nuevas (prórroga, resolución de la apelación, eje, actividades del ticket), valores del mockup (adjuntos, Mesa SGD, buses) y `sinGuia` en la guía.'
x-areas-de-error:
  - { area: TKT, alcance: 'Tickets y todo lo que se registra como ticket o actúa sobre uno: bandeja, flujos, rayo, actividades, Mesa de casos sensibles (SGD), señal de conflicto y handoff, notas de estado, Entrega Fest y formularios simples (ingreso y reserva de bus son tipos de ticket del catálogo)' }
  - { area: SLA, alcance: 'Políticas y alertas de SLA; hoy ninguna operación del contrato la usa' }
  - { area: LRC, alcance: 'Libro de Reclamaciones: asiento, prórroga y respuesta formal' }
  - { area: APL, alcance: 'Apelaciones internas y ante INDECOPI' }
  - { area: GAR, alcance: 'Reclamos de garantía postventa' }
  - { area: PTL, alcance: 'Mi Portal (operaciones del cliente)' }
servers:
  - url: http://localhost:8081
    description: local
security:
  - bearer-jwt: []
tags:
  - name: tickets
    description: 'Módulo `tickets` (ADR-001): núcleo del ticket, interacciones, derivación, reasignación, actividades del flujo, y los casos y frases del Entrega Fest (EP-ATC-01, 02 y 08).'
  - name: sla
    description: 'Módulo `sla` (ADR-001, ADR-005): compromisos y alertas de SLA (EP-ATC-02).'
  - name: inbox
    description: 'Módulo `inbox` (ADR-001): bandeja orquestadora, casillero, flujos por área, rayo, guía, asistencia de IA, tablero y visor 3D (EP-ATC-02, 07 y 09).'
  - name: complaintbook
    description: 'Módulo `complaintbook` (ADR-001): Libro de Reclamaciones y apelaciones (EP-ATC-03).'
  - name: customer360
    description: 'Módulo `customer360` (ADR-001, ADR-003): búsqueda y consulta 360 del cliente, llamada, motor de José y documentos (EP-ATC-10).'
  - name: portal
    description: 'Módulo `portal` (ADR-001, ADR-011): operaciones del cliente en Mi Portal (EP-ATC-06).'
  - name: legalcases
    description: 'Módulo `legalcases` (ADR-001): Mesa de casos sensibles SGD y gate a Eje 3: señal de conflicto, handoff y nota de estado (EP-ATC-04).'
  - name: aftersales
    description: 'Módulo `aftersales` (ADR-001): reclamos de garantía postventa (EP-ATC-05).'
  - name: delinquency
    description: 'Módulo `delinquency` (ADR-001): resolución por morosidad (jobs, ADR-005) y formularios simples de ingreso al proyecto y reserva de bus (EP-ATC-11).'
paths:
  /api/v1/tickets:
    post:
      tags: [tickets]
      operationId: registrarTicket
      summary: "Registrar un ticket tipificado desde cualquier canal y entregar su número por razón social (cliente identificado o interesado con datos mínimos)"
      x-historias: [HU-001, HU-002, HU-051]
      x-estado: borrador
      x-permiso: "ATC.TICKETS + crear"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketNuevo' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/tickets/{ticketId}:
    get:
      tags: [tickets]
      operationId: obtenerTicket
      summary: "Obtener un ticket con sus hitos probatorios"
      x-historias: [HU-004, HU-006, HU-050]
      x-estado: borrador
      x-permiso: "ATC.TICKETS + ver"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR, ATC_LEGAL, ATC_POSTVENTA, ATC_CASES_DESK, ATC_CX]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/tickets/{ticketId}/estado:
    post:
      tags: [tickets]
      operationId: cambiarEstado
      summary: "Cambiar el estado del ticket con historial inmutable (rechaza cerrar con señal de conflicto en Eje 1/2)"
      x-historias: [HU-004, HU-026]
      x-estado: borrador
      x-permiso: "ATC.TICKETS + editar"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR, ATC_LEGAL, ATC_POSTVENTA]
      x-errores-negocio:
        - { codigo: AYB-TKT-409, cuando: 'Transición no permitida: un ticket CLOSED no pasa a IN_PROGRESS sin reabrirse (HU-004 CA-04), o se intenta resolver o cerrar en Eje 1/2 un ticket con señal de conflicto (gate no compensable, HU-026 CA-02).' }
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioEstado' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/tickets/{ticketId}/interacciones:
    post:
      tags: [tickets]
      operationId: registrarInteraccion
      summary: "Registrar una interacción visible o una nota interna, con adjuntos"
      x-historias: [HU-005]
      x-estado: borrador
      x-permiso: "ATC.TICKETS + editar"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR, ATC_LEGAL, ATC_POSTVENTA]
      x-errores-negocio:
        - { codigo: AYB-TKT-422, cuando: 'Adjunto de más de 10 MB o de formato no admitido (HU-064 CA-05), o texto con DNI o número de tarjeta en una nota (HU-005 CA-04; RN-SVC-012).' }
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Interaccion' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interaccion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/tickets/{ticketId}/derivaciones:
    post:
      tags: [tickets]
      operationId: derivarTicket
      summary: "Derivar un ticket a otra área con motivo tipificado"
      x-historias: [HU-007]
      x-estado: borrador
      x-permiso: "ATC.TICKETS.REFER + editar"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Derivacion' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/tickets/{ticketId}/reaperturas:
    post:
      tags: [tickets]
      operationId: reabrirTicket
      summary: "Reabrir un ticket con un nuevo compromiso, sin borrar el original"
      x-historias: [HU-011]
      x-estado: borrador
      x-permiso: "ATC.TICKETS.REOPEN + editar"
      x-roles: [ATC_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reapertura' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/colaboradores/{colaboradorId}/reasignaciones:
    post:
      tags: [tickets]
      operationId: reasignarEnBloque
      summary: "Reasignar en bloque los tickets de un colaborador que cesa"
      x-historias: [HU-008]
      x-estado: borrador
      x-permiso: "ATC.TICKETS.REASSIGN_BULK + editar"
      x-roles: [ATC_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: colaboradorId
          in: path
          required: true
          description: 'PartyID del colaborador que cesa, como las columnas `*PartyID` del v7 (no es el `user_account_id` del token; ATC los relaciona con `CuentaPersonaPort`, ED-01). Se elige entre los gestores de la cola (ED-03).'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reasignacion' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoReasignacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/tickets/{ticketId}/sla:
    get:
      tags: [sla]
      operationId: consultarSla
      summary: "Consultar los compromisos de SLA del ticket"
      x-historias: [HU-003, HU-010]
      x-estado: borrador
      x-permiso: "ATC.TICKETS.SLA + ver"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR, ATC_LEGAL, ATC_POSTVENTA, ATC_CX]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sla' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/bandeja:
    get:
      tags: [inbox]
      operationId: listarBandeja
      summary: "Bandeja única ordenada por urgencia"
      x-historias: [HU-044, HU-045]
      x-estado: borrador
      x-permiso: "ATC.INBOX + ver"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR, ATC_LEGAL, ATC_POSTVENTA]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: pagina, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: area, in: query, schema: { type: string }, description: 'Solo áreas a las que pertenece el usuario, salvo supervisor (HU-044 CA-03).' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaTickets' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/casillero:
    get:
      tags: [inbox]
      operationId: listarCasillero
      summary: "Casillero de tareas por área y responsable"
      x-historias: [HU-009]
      x-estado: borrador
      x-permiso: "ATC.INBOX.LOCKER + ver"
      x-roles: [ATC_AGENT, ATC_SUPERVISOR, ATC_LEGAL, ATC_POSTVENTA]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: pagina, in: query, schema: { type: integer, minimum: 0, default: 0 } }
