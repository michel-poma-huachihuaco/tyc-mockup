      properties:
        tipo: { type: string, enum: [FIRST_RESPONSE_OVERDUE, RESOLUTION_OVERDUE, LEGAL_RESPONSE_OVERDUE, LEGAL_EXTENSION_WINDOW_CLOSING], description: 'BreachTypeID: lista SVC_SLA_BREACH_TYPE del Excel (RF-SVC-010).' }
        ciclo: { type: integer, description: 'ReopenCycleNumber (RN-SVC-008).' }
        vencimientoEvaluado: { type: string, format: date-time, description: 'EvaluatedDueDateTime (HU-010 CA-02).' }
        destinatarioId: { type: string, description: 'AlertedPartyID (PartyID del colaborador alertado).' }
        canal: { type: string, description: 'ChannelID.' }
        fecha: { type: string, format: date-time, description: 'Fecha de la alerta (HU-010 CA-02).', x-decision: 'Columna CreatedDate (convención del v7, timestamptz; ED-16).' }
    PaginaTickets:
      type: object
      description: "Página de tickets."
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/TicketResumen' } }
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
    Flujo:
      type: object
      description: "Definición de flujo versionada con actividades (SVC_WORKFLOW_DEFINITION y SVC_WORKFLOW_ACTIVITY, tablas de ATC como cambio al v7; ED-15)."
      required: [responsableId, actividades]
      properties:
        responsableId: { type: string, description: 'Rol responsable de la cola del área (ATC_AGENT, o ATC_POSTVENTA en Postventa), sin personas (ED-14; DT-03).' }
