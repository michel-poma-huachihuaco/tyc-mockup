            type: object
            properties:
              fechaHora: { type: string, format: date-time }
              evento: { type: string }
    PortalTicketNuevo:
      type: object
      additionalProperties: false
      description: "Alta de un ticket desde Mi Portal (HU-064 CA-01; ADR-011, decisión 8). Solo lleva lo que el cliente elige y escribe. No lleva identificador de cliente, canal, prioridad, empresa ni línea: el servidor toma el `PartyID` del cliente autenticado (ED-01), fija el canal `MI_PORTAL` y la prioridad (la del flujo si la fija; si no, Media; ED-26) y saca la empresa y la línea del contrato (RN-SVC-005). Cualquier otro campo responde AYB-VAL-400."
      required: [tipoId, subtipo, descripcion]
      properties:
        tipoId: { type: string, description: 'Tipo elegido de los que devuelve listarTiposPortal. Si es reclamo o queja (`libro: true`), responde AYB-PTL-422 con el aviso legal (HU-064 CA-04).' }
        subtipo: { type: string, description: 'Subtipo elegido de los del tipo (HU-064 CA-01; catálogo del piloto de ADR-008, ED-14; los que ve el cliente, Q-064-1).' }
        descripcion: { type: string, minLength: 1, description: 'Lo que describe el cliente (HU-064 CA-01).' }
        contratoId: { type: string, description: 'Contrato (lote) del cliente al que se refiere el ticket. El servidor comprueba que es suyo (si no, AYB-PTL-404) y de él saca la empresa y la línea. Si el cliente tiene un solo contrato puede omitirse.', x-decision: 'El cliente elige el lote (mockup, DECISIONES.md §5.2; ED-26).' }
        adjuntos:
          type: array
          description: 'Referencias de los archivos ya subidos. Hasta 10 MB cada uno y formatos admitidos; si no, AYB-VAL-400 con el tamaño y los formatos permitidos (HU-064 CA-05).'
          x-decision: 'JPG, PNG o PDF de hasta 10 MB, máximo 3 por ticket (ADR-011, decisión 7; ED-26).'
          maxItems: 3
          items: { type: string }
