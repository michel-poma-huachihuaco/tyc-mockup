              enCola: { type: integer }
              gestoresOcupados: { type: integer, description: 'Gestores con un ticket en atención en la cola del área (dato de ATC).' }
              gestoresTotal: { type: integer, description: 'Gestores de la cola del área: los que la bitácora de asignaciones de ATC muestra en esa cola en los últimos 30 días (GestoresPort, adaptador «actividad de ATC»; ED-03).' }
              resueltos: { type: integer }
              porcentajeEnSla: { type: number }
              cargaPorGestor:
                type: array
                items:
                  type: object
                  properties:
                    gestorId: { type: string, description: 'PartyID del gestor (HU-067 CA-04).' }
                    tickets: { type: integer }
        tickets:
          type: array
          items:
            type: object
            description: 'Ticket en la escena (HU-067 CA-02 y CA-03).'
            properties:
              ticketId: { type: string }
              tipoId: { type: string }
              areaId: { type: string }
              estado: { $ref: '#/components/schemas/EstadoTicket' }
              estadoSla: { type: string, enum: [ON_TRACK, AT_RISK, BREACHED], description: 'Holgado (verde), en riesgo (naranja) o vencido (rojo) (HU-067 CA-03).', x-decision: 'En riesgo desde el 75 % del SLA consumido (PLT-04 §6.1 del visor; ED-26).' }
              rayo: { type: boolean }
              prioridadId: { type: string }
        actividad:
          type: array
