      operationId: cancelarReserva
      summary: "Cancelar la reserva: libera el cupo y lo pasa al primero de la lista de espera"
      description: 'Operación del cliente (rol `CUSTOMER`, ADR-011). La identidad del cliente sale solo de su token: es el `PartyID` del cliente autenticado (el token no lo trae: ATC lo obtiene del vínculo de la cuenta en la base única con `CuentaPersonaPort`, ED-01). Admite la cuenta de tipo `CUSTOMER` o el rol `CUSTOMER` y rechaza `PROSPECT`. Ningún identificador de cliente viaja en el cuerpo, la ruta ni la consulta. Solo actúa sobre una reserva de ese cliente: la de otro cliente responde AYB-PTL-404 y el intento queda en la auditoría.'
      x-historias: [HU-060]
      x-estado: borrador
      x-permiso: "ATC.PORTAL.BUS_BOOKING + eliminar"
      x-roles: [CUSTOMER]
      x-errores-negocio:
        - { codigo: AYB-PTL-404, cuando: 'La reserva no es del cliente autenticado: se responde como inexistente y el intento queda en la auditoría.' }
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: reservaId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
components:
  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT del servidor de autorización de Control de acceso (PJ-05; DT-05). Consola y Mi Portal lo obtienen con @aybarcorp/auth (Authorization Code con PKCE); las llamadas entre servicios, con client_credentials (DT-10). Roles en realm_access.roles y company_roles; el token no trae permisos ni PartyID: ATC autoriza por rol (ED-02) y obtiene el PartyID con `CuentaPersonaPort` (ED-01). Audiencia: `aybar-atc` (ED-06).'
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Si falta, el servicio genera uno y lo devuelve en la respuesta.
      schema: { type: string }
  responses:
    SolicitudInvalida:
      description: 'AYB-VAL-400: cuerpo, parámetro o validación inválidos; lo emite aybar-starter-web, con `campos` cuando falla la validación.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
    NoAutenticado:
      description: 'AYB-SEG-401: sin token, o token con firma, emisor, vencimiento o audiencia inválidos. Lo emiten aybar-starter-security y aybar-starter-web; un token sin la audiencia de la API puede cortarlo antes Azure API Management (D-44 de PJ-05). ATC no lo reinventa.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
    SinPermiso:
      description: 'AYB-SEG-403: falta el rol que exige `@PreAuthorize` (ver `x-roles`). Lo emiten aybar-starter-security y aybar-starter-web; ATC no lo reinventa ni emite AYB-PEF-403, que es de Control de acceso (D-169 de PJ-05). El intento denegado queda en la auditoría de ATC cuando la historia lo pide.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
    NoEncontrado:
      description: 'AYB-REC-404 (SDK): el recurso no existe. En Mi Portal, el ticket de otro cliente responde AYB-PTL-404 (ver `x-errores-negocio`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
    Conflicto:
      description: 'AYB-<ÁREA>-409 de negocio, con un área de `x-areas-de-error`; el caso de cada operación está en su `x-errores-negocio`. Lo lanza ATC con AybarException.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
    NoProcesable:
      description: 'AYB-<ÁREA>-422 de negocio, con un área de `x-areas-de-error`; el caso de cada operación está en su `x-errores-negocio`. Lo lanza ATC con AybarException.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
    DemasiadasSolicitudes:
      description: 'AYB-GEN-429: demasiadas solicitudes; lo emite el SDK o el límite del borde (Azure API Management).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
    ErrorInterno:
      description: 'AYB-GEN-500: error no controlado; el detalle va al log con el `correlationId`, nunca al cliente (aybar-starter-web).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaAybar' }
  schemas:
    ProblemaAybar:
      type: object
      description: 'ProblemDetail RFC 7807 que construye aybar-starter-web (ProblemasAybar), igual al esquema que el SDK publica en /v3/api-docs.'
      required: [type, title, status, codigo, timestamp]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        codigo: { type: string, pattern: '^AYB-[A-Z]{3}-[0-9]{3}$', description: 'Código público AYB-<ÁREA>-<HTTP>. Plataforma (CodigoErrorAybar del SDK): AYB-GEN-500, AYB-VAL-400, AYB-SEG-401, AYB-SEG-403, AYB-REC-404, AYB-MET-405, AYB-MED-415, AYB-GEN-429. Negocio de ATC: solo las áreas TKT, SLA, LRC, APL, GAR y PTL (x-areas-de-error), lanzados con AybarException con la cadena literal (el catálogo CodigoNegocio del SDK no existe todavía, skill aybar-errores), por ejemplo AYB-TKT-409. Nunca un área de Control de acceso (SEG de negocio, PEF, VRS, USR, SOD...).', example: AYB-TKT-409 }
        correlationId: { type: string, nullable: true, description: 'Del MDC de aybar-starter-logging; nulo si la petición no pasó por el filtro de correlación.' }
        timestamp: { type: string, format: date-time }
        campos:
          type: array
          description: 'Solo en AYB-VAL-400 por validación.'
          items: { type: object, properties: { campo: { type: string }, mensaje: { type: string } } }
    TicketNuevo:
      type: object
      description: "Alta de un ticket tipificado desde la consola, por cualquier canal (HU-001, HU-002, HU-051): empresa y línea obligatorias y no derivables (RN-SVC-005); va `clienteId` o `interesado`. Solo para gestores; Mi Portal usa `PortalTicketNuevo`."
      required: [canal, empresaId, lineaNegocioId, tipoId, prioridadId, resumen]
      properties:
        canal: { type: string }
        empresaId: { type: string }
        lineaNegocioId: { type: string }
        tipoId: { type: string }
        prioridadId: { type: string }
        resumen: { type: string }
        clienteId: { type: string, description: 'PartyID del v7. Va este campo o `interesado`: uno de los dos (HU-051).' }
        interesado: { type: object, description: 'Datos mínimos cuando la persona no existe en PARTY o la fuente está caída (HU-051 CA-01): el ticket se registra «sin cliente vinculado» (PartyID vacío) y estos datos van a SVC_TICKET_PROSPECT, tabla de ATC, hasta que Control de acceso cree su PARTY al autorregistrarla; entonces el job de vinculación completa el PartyID y los borra (ED-05). ATC no crea la PARTY.', properties: { tipoDocumento: { type: string }, documento: { type: string }, nombre: { type: string }, telefono: { type: string }, correo: { type: string } } }
        subtipo: { type: string, description: 'SubtypeID: catálogo MAE_TICKET_SUBTYPE de ATC (cambio al v7; ED-15).' }
        descripcion: { type: string }
        establecimientoId: { type: string, description: 'CompanyAddressID del v7.' }
        contratoId: { type: string, description: 'ContractID del v7.' }
        unidadId: { type: string, description: 'UnitID del v7.' }
        productoId: { type: string, description: 'ProductID del v7.' }
    Ticket:
      type: object
      description: "Ticket (SVC_TICKET, ENT-SVC-001) tal como lo ve la consola. Cada propiedad cita la columna del v7 o del Excel del PO y su fuente; los ids del v7 son enteros y se exponen como cadenas opacas. No se devuelve en Mi Portal, que usa `PortalTicket`."
      x-decision: "Tipos, largos y nulabilidad de los atributos no clave: ED-16 (`datos/diccionario.md`). Rayo, señal de conflicto, eje actual, vinculación, subtipo, flujo y actividades son columnas y tablas de ATC (cambio al v7 del fragmento SERVICE; ED-15 y `datos/registro-de-tablas.md` §3). `PARTY` de la base única es la fuente viva de la clave foránea PartyID (DT-06); la diferencia con el ADR-03 del PO está listada en ED-19."
      required: [ticketId, numero, empresaId, lineaNegocioId, canal, tipoId, prioridadId, estado]
      properties:
        ticketId: { type: string, description: 'TicketID.' }
        numero: { type: string, description: 'TicketNumber: número visible por razón social, único por CompanyID (RN-SVC-004; HU-002).', x-decision: 'Formato `<código de la razón social>-<correlativo de 6 dígitos>`, sin reinicio anual (FT-01; ED-26).' }
        empresaId: { type: string, description: 'CompanyID: obligatoria y no derivable (RN-SVC-005).' }
        lineaNegocioId: { type: string, description: 'BusinessLineID: obligatoria y no derivable (RN-SVC-005).' }
        establecimientoId: { type: string, nullable: true, description: 'CompanyAddressID: vacío si el canal es remoto (HU-001 CA-02).' }
        clienteId: { type: string, nullable: true, description: 'PartyID. Vacío mientras el ticket está «sin cliente vinculado» (HU-051 CA-01).', x-decision: 'Nulo para el interesado sin PARTY (ED-05, ED-16).' }
        contratoId: { type: string, nullable: true, description: 'ContractID: opcional (RN-SVC-005).' }
        unidadId: { type: string, nullable: true, description: 'UnitID.', x-decision: 'Nulo si la solicitud no es de un lote (ED-16).' }
        productoId: { type: string, nullable: true, description: 'ProductID.', x-decision: 'Nulo si la solicitud no es de un producto (ED-16).' }
        canal: { type: string, description: 'ChannelID (MAE_CHANNEL, ENT-REF-001): teléfono, WhatsApp o correo (HU-001), Mi Portal (HU-064) o formulario (RN-SVC-041).' }
        tipoId: { type: string, description: 'TicketTypeID (MAE_TICKET_TYPE, ENT-SVC-005).' }
        subtipo: { type: string, description: 'Subtipo del ticket (PLT-04 HU-064 §6.5: SubtypeID).', x-decision: 'Columna nueva SubtypeID de SVC_TICKET y catálogo MAE_TICKET_SUBTYPE (cambio al v7; ED-15).' }
        prioridadId: { type: string, description: 'PriorityID (MAE_TICKET_PRIORITY, ENT-SVC-006: LOW, MEDIUM, HIGH, URGENT).' }
        politicaSlaId: { type: string, description: 'SLAPolicyID: política congelada al abrir el ticket (RN-SVC-002).' }
        estado: { $ref: '#/components/schemas/EstadoTicket' }
        areaActualId: { type: string, description: 'CurrentAreaID (MAE_AREA, ENT-SVC-007).' }
        responsableActualId: { type: string, nullable: true, description: 'CurrentOwnerPartyID; vacío es «sin asignar» (HU-009 CA-03).' }
        creadoPorId: { type: string, description: 'CreatedByPartyID.' }
        resumen: { type: string, description: 'Resumen de la solicitud (HU-001). Narrativa visible solo para roles de atención o Legal (RNF-SEC-008).' }
        descripcion: { type: string, description: 'Descripción (RF-SVC-001). Narrativa restringida por rol (RNF-SEC-008).' }
        abiertoEn: { type: string, format: date-time, description: 'OpenedDateTime.' }
        venceRespuesta: { type: string, format: date-time, description: 'FirstResponseDueDateTime: congelado al abrir (RN-SVC-002).' }
        venceResolucion: { type: string, format: date-time, description: 'ResolutionDueDateTime: congelado al abrir (RN-SVC-002).' }
        venceResolucionReapertura: { type: string, format: date-time, nullable: true, description: 'ReopenedResolutionDueDateTime: nuevo compromiso al reabrir; el original no se reescribe (RN-SVC-007; HU-011).' }
        primeraRespuestaEn: { type: string, format: date-time, nullable: true, description: 'FirstRespondedDateTime (HU-005 CA-01).' }
        primeraResolucionEn: { type: string, format: date-time, nullable: true, description: 'FirstResolvedDateTime: nunca se sobrescribe (HU-006).' }
        resueltoEn: { type: string, format: date-time, nullable: true, description: 'ResolvedDateTime: el del último ciclo (HU-006).' }
        cerradoEn: { type: string, format: date-time, nullable: true, description: 'ClosedDateTime: no cambia salvo reapertura (HU-006).' }
        reaperturas: { type: integer, minimum: 0, description: 'ReopenCount (HU-011 CA-02).' }
        activo: { type: boolean, description: 'IsActive (Excel, RF-SVC-015).' }
        rayo: { type: boolean, description: 'Marca de rayo (HU-045; PLT-04 §6.5 «Rayo · Motivo»).', x-decision: 'Columna nueva de SVC_TICKET (cambio al v7; `datos/registro-de-tablas.md` §3).' }
        motivoRayo: { type: string, nullable: true, description: 'Motivo del rayo (HU-045 CA-01).', x-decision: 'Columna nueva de SVC_TICKET (cambio al v7; `datos/registro-de-tablas.md` §3).' }
        conflicto: { type: boolean, description: 'Señal de conflicto que bloquea la resolución en Eje 1/2 (HU-026; PLT-04 §6.5 «ConflictFlag»).', x-decision: 'Columna nueva de SVC_TICKET (cambio al v7; `datos/registro-de-tablas.md` §3).' }
        ejeActual: { type: string, description: 'Eje actual del ticket (PLT-04 HU-026 §6.5).', x-decision: 'Columna nueva CurrentAxisCode de SVC_TICKET con los códigos AXIS_1, AXIS_2 y AXIS_3 (cambio al v7; ED-26).' }
        vinculacionPendiente: { type: boolean, description: 'Ticket de «Interesado» registrado sin cliente vinculado (HU-051; PLT-04 §6.5 «VinculaciónPendiente»; ED-05).', x-decision: 'Columna nueva de SVC_TICKET (cambio al v7; `datos/registro-de-tablas.md` §3).' }
        flujoId: { type: string, nullable: true, description: 'Flujo (versión) congelado al abrir el ticket (HU-043 CA-02; PLT-04 §6.5 «FK WorkflowID»).', x-decision: 'Columna nueva WorkflowID hacia SVC_WORKFLOW_DEFINITION, tabla de ATC (cambio al v7; ED-15).' }
        actividades:
          type: array
          description: 'Actividades del flujo en orden, cada una con su SLA (HU-043 CA-01 y CA-04).'
          x-decision: 'Tabla de ATC SVC_TICKET_ACTIVITY (cambio al v7; ED-15): estado, fecha en que se habilita, vencimiento y cierre de cada actividad del ticket.'
          items:
            type: object
            properties:
              numero: { type: integer, description: 'Orden de la actividad (es el `numero` de cerrarActividad).' }
              nombre: { type: string }
              responsableId: { type: string, description: 'Rol responsable de la cola (ED-14) o, cuando un gestor la toma, su PartyID (HU-043 CA-04).' }
              slaHoras: { type: number, description: 'SLA de la actividad en horas hábiles (HU-043 CA-05).' }
              estado: { type: string, enum: [PENDING, ENABLED, PAUSED, CLOSED], description: 'Estado de la actividad: una se habilita al cerrar la anterior (HU-043 CA-04); en pausa mientras el ticket espera al cliente (ADR-008, regla 6).' }
              habilitadaEn: { type: string, format: date-time, nullable: true }
              venceEn: { type: string, format: date-time, nullable: true }
              cerradaEn: { type: string, format: date-time, nullable: true }
    EstadoTicket:
      type: string
      description: "Estado del ticket: lista `SVC_TICKET_STATUS` del Excel (RF-SVC-004; PLT-04 HU-004). Transiciones en docs/datos/estados.md."
      enum: [OPEN, IN_PROGRESS, PENDING_CUSTOMER, ESCALATED, RESOLVED, CLOSED, REOPENED]
    TicketResumen:
      type: object
      description: "Fila de la bandeja, del casillero y del tablero (HU-009, HU-044, HU-045). «Mis tickets» de Mi Portal usa `PortalTicketResumen`."
      x-decision: "Orden de la bandeja: primero el rayo, luego el vencimiento de SLA más próximo y luego la prioridad (HU-044 CA-01). «En riesgo» = 75 % o más del SLA consumido, el umbral que dibuja el PLT-04 §6.1 del visor (HU-009 CA-02; ED-26)."
      properties:
        ticketId: { type: string }
        numero: { type: string, description: 'TicketNumber.' }
        canal: { type: string, description: 'Canal de entrada (HU-044 CA-01).' }
        tipoId: { type: string }
        subtipo: { type: string, x-decision: 'SubtypeID (ED-15).' }
        prioridadId: { type: string }
        estado: { $ref: '#/components/schemas/EstadoTicket' }
        areaActualId: { type: string, description: 'Área responsable (HU-064 CA-02).' }
        responsableActualId: { type: string, nullable: true, description: 'CurrentOwnerPartyID (PartyID del colaborador); vacío es «sin asignar» (HU-009 CA-03).' }
        venceResolucion: { type: string, format: date-time, description: 'Fecha de compromiso (HU-064 CA-02): ResolutionDueDateTime, o ReopenedResolutionDueDateTime si el ticket se reabrió.' }
        abiertoEn: { type: string, format: date-time }
        rayo: { type: boolean, description: 'Los tickets con rayo van primero (HU-045 CA-01).', x-decision: 'Columna nueva de SVC_TICKET (cambio al v7; `datos/registro-de-tablas.md` §3).' }
    CambioEstado:
      type: object
      description: "Cambio de estado del ticket (HU-004). Cada cambio agrega una fila a SVC_TICKET_STATUS_LOG, bitácora firmada (RNF-AUD-004). Un ticket CLOSED no pasa a IN_PROGRESS sin reabrirse, y con señal de conflicto no se resuelve ni se cierra en Eje 1/2: 409 (HU-004 CA-04; HU-026)."
      required: [estado]
      properties:
        estado: { $ref: '#/components/schemas/EstadoTicket' }
    Interaccion:
      type: object
      description: "Interacción (SVC_TICKET_INTERACTION, ENT-SVC-004) registrada desde la consola: visible al cliente o nota interna, con la evidencia adjunta. Mi Portal no usa este esquema: el cliente responde con `PortalRespuesta` y ve `PortalInteraccion`."
      required: [tipo, visible, texto]
      properties:
        interaccionId: { type: string, readOnly: true, description: 'TicketInteractionID.' }
        tipo: { type: string, description: 'InteractionTypeID: lista SVC_TICKET_INTERACTION_TYPE del Excel (RF-SVC-005): CUSTOMER_MESSAGE, AGENT_RESPONSE, INTERNAL_NOTE, STATUS_CHANGE, más CALL.', x-decision: 'La llamada (HU-042; «Tipo = LLAMADA» en el PLT-04 §6.5) entra a la lista de SERVICE como valor nuevo CALL; diferencia listada en ED-19.' }
        visible: { type: boolean, description: 'IsVisibleToCustomer: false es nota interna y no se muestra en Mi Portal (HU-005 CA-03; HU-065 CA-03).' }
        texto: { type: string, description: 'El sistema advierte si una nota trae un DNI o una tarjeta (HU-005 CA-04; RN-SVC-012).' }
        canal: { type: string, description: 'ChannelID.' }
        autor: { type: string, readOnly: true, description: 'Cliente o gestor (PLT-04 HU-064 a 066 §6.5); el gestor es AgentPartyID.' }
        adjuntos: { type: array, items: { type: string }, description: 'La evidencia va dentro de la interacción, sin tabla de adjuntos aparte (HU-005 CA-02); máximo 10 MB y formatos admitidos (HU-064 CA-05).' }
        duracionSegundos: { type: integer, description: 'Para la llamada registrada como interacción (HU-042 CA-02).' }
        enlaceGrabacion: { type: string }
    Derivacion:
      type: object
      description: "Derivación a otra área con motivo tipificado (HU-007). Sin persona, AssignedToPartyID queda vacío y se actualiza CurrentAreaID (HU-007 CA-01)."
      required: [areaId, motivoId]
      properties:
        areaId: { type: string, description: 'AreaID (MAE_AREA, ENT-SVC-007: ATC, COBRANZA, LEGAL, POSTVENTA, TI, ADMINISTRACION).' }
        responsableId: { type: string, nullable: true, description: 'AssignedToPartyID (PartyID del colaborador): opcional (HU-007 CA-01).' }
        motivoId: { type: string, description: 'AssignmentReasonID: motivo obligatorio del catálogo (HU-007 CA-03). Lista SVC_ASSIGNMENT_REASON del Excel (RF-SVC-007): ESCALATION, DERIVATION_TO_AREA, REASSIGNMENT_ROTATION, REASSIGNMENT_RESIGNATION, REASSIGNMENT_TERMINATION, más REASSIGNMENT_WORKLOAD.', x-decision: 'El cese de HU-008 (REASSIGNMENT_CESE en el PLT-04) se registra como REASSIGNMENT_TERMINATION; la reasignación por carga de HU-046 (REASSIGNMENT_CARGA) entra a la lista como valor nuevo REASSIGNMENT_WORKLOAD. Diferencias listadas en ED-19.' }
    Reapertura:
      type: object
      description: "Reapertura (HU-011): se calcula ReopenedResolutionDueDateTime con la política vigente, sube ReopenCount y el compromiso original no se reescribe (RN-SVC-007); cada ciclo tiene sus alertas (RN-SVC-008)."
      required: [motivo]
      properties:
        motivo: { type: string }
    Reasignacion:
      type: object
      description: "Reasignación en bloque a uno o varios destinatarios (HU-008)."
      x-decision: "Motivo REASSIGNMENT_TERMINATION de la lista SVC_ASSIGNMENT_REASON del Excel para el cese (HU-008 CA-01 lo llama REASSIGNMENT_CESE; diferencia listada en ED-19). El gestor que cesa y los destinatarios se eligen entre los gestores de la cola (ED-03)."
      required: [destinatarios]
      properties:
        destinatarios:
          type: array
          minItems: 1
          description: 'Uno o varios; el resumen de la respuesta dice cuántos tickets recibió cada uno (HU-008 CA-02). Cada fila nueva lleva el motivo REASSIGNMENT_CESE.'
          items:
            type: object
            required: [responsableId]
            properties:
              responsableId: { type: string, description: 'PartyID del colaborador que recibe los tickets.' }
              areaDestinoId: { type: string }
    ResultadoReasignacion:
      type: object
      description: "Resumen de la reasignación en bloque: cuántos tickets recibió cada destinatario (HU-008 CA-02)."
      properties:
        total: { type: integer, description: 'Tickets reasignados.' }
        porDestinatario:
          type: array
          items:
            type: object
            properties:
              responsableId: { type: string }
              tickets: { type: integer }
        motivo: { type: string, description: 'Motivo de cada fila nueva en SVC_TICKET_ASSIGNMENT_LOG: REASSIGNMENT_TERMINATION (cese; HU-008 CA-01).', x-decision: 'HU-008 CA-01 dice REASSIGNMENT_CESE; se usa el valor de la lista del Excel (ED-19).' }
    Sla:
      type: object
      description: "Compromisos de SLA del ticket, sus pausas y sus alertas (HU-003, HU-010 y HU-011)."
      properties:
        politicaId: { type: string, description: 'Política congelada al abrir el ticket (SLAPolicyID del v7); manda la específica (tipo + prioridad) sobre la genérica (RN-SVC-001).' }
        baseTiempo: { type: string, description: 'TimeBasis de la política: BUSINESS_HOURS o BUSINESS_DAYS, contra MAE_TIME y MAE_HOLIDAY por geografía del establecimiento (RN-SVC-003; HU-003 CA-02).', x-decision: 'Lista SVC_SLA_TIME_BASIS de SERVICE, semilla de ATC con GenericListID fijo (ED-11).' }
        venceRespuesta: { type: string, format: date-time, description: 'FirstResponseDueDateTime (RN-SVC-002).' }
        venceResolucion: { type: string, format: date-time, description: 'ResolutionDueDateTime (RN-SVC-002).' }
        venceResolucionReapertura: { type: string, format: date-time, nullable: true, description: 'ReopenedResolutionDueDateTime: las alertas evalúan este vencimiento mientras exista (HU-011 CA-01).' }
        pausas:
          type: array
          description: 'Pausas del SLA mientras el ticket espera al cliente: el SLA se reanuda cuando responde (HU-066 CA-01). El detalle (desde, hasta, horas y motivo) vive en SVC_TICKET_SLA_PAUSE, tabla de ATC (cambio al v7; ED-15).'
          items:
            type: object
