      operationId: listarMisTickets
      summary: "Consultar mis tickets"
      description: 'Operación del cliente (rol `CUSTOMER`, ADR-011). La identidad del cliente sale solo de su token: es el `PartyID` del cliente autenticado (el token no lo trae: ATC lo obtiene del vínculo de la cuenta en la base única con `CuentaPersonaPort`, ED-01). Admite la cuenta de tipo `CUSTOMER` o el rol `CUSTOMER` y rechaza `PROSPECT`. Ningún identificador de cliente viaja en el cuerpo, la ruta ni la consulta. Devuelve solo los tickets de ese cliente, del más reciente al más antiguo, con número, tipo, estado, área y fecha de compromiso (HU-064 CA-02), en el esquema propio `PortalTicketResumen`: sin responsable, prioridad, notas internas ni datos internos del ticket.'
