      required: [identificacion, kycValidado, proyectoLote, pagosEstadoCuenta, atencionPrevia, proximoPaso]
      properties:
        identificacion: { type: string }
        kycValidado: { type: boolean }
        proyectoLote: { type: string }
        pagosEstadoCuenta: { type: string }
        atencionPrevia: { type: string }
        proximoPaso: { type: string }
    ConfirmacionHandoff:
      type: object
      description: "Confirmación de recepción del handoff por el especialista de Eje 3 (HU-027 CA-02)."
      required: [recibidoPor]
      properties:
        recibidoPor: { type: string }
    NotaEstado:
      type: object
      description: "Nota de estado emocional sin juicios de valor (HU-028)."
      required: [texto]
      properties:
        texto: { type: string }
    ReclamoGarantia:
      type: object
      description: "Reclamo de garantía vinculado a una entrega (HU-033 a 036; CONTRACT_WARRANTY_CLAIM del fragmento CONTRACT). Sin entrega no hay reclamo (RN-SVC-027); fuera de cobertura es «no procedente por vigencia» (422)."
      required: [entregaId, tipo, descripcion]
