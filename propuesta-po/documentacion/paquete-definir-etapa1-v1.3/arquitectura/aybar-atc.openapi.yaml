        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
    PortalTrazabilidad:
      type: object
      description: "Línea de tiempo del ticket en Mi Portal (HU-065): cada paso con fecha y hora, área responsable y fecha de compromiso, en el orden de la bitácora de estados (CA-01). Sin notas internas ni nombre ni ID del gestor (CA-03)."
