      properties:
        motivo: { type: string }
    Cargo:
      type: object
      description: "Cargo previo o de activación (HU-021)."
      required: [tipo]
      properties:
        tipo: { type: string, enum: [PREVIO, ACTIVACION], description: 'El SLA de línea corre desde el cargo de activación (HU-021 CA-02).' }
    Riesgo:
      type: object
      description: "Criterios de la matriz de riesgo (HU-022)."
      required: [criterios]
      properties:
        criterios: { type: array, minItems: 1, items: { type: string }, description: 'Criterios marcados; el nivel resulta de la matriz, no de un campo de opinión (HU-022 CA-01).' }
        motivoRecalibracion: { type: string }
    Escalamiento:
      type: object
      description: "Nivel de la cadena de escalamiento (HU-023)."
      required: [nivel]
      properties:
        nivel: { type: string, enum: [JEFATURA, COMITE, DIRECTORIO], description: 'No se puede saltar un nivel (409; HU-023 CA-02).' }
    PaginaCasos:
      type: object
      description: "Casos abiertos del mismo cliente y hechos (HU-024 CA-01)."
      x-pendiente: "Criterio de coincidencia (pregunta abierta)."
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/CasoSensible' } }
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
    Vinculo:
      type: object
      description: "Vínculo entre casos con el mismo cliente y hechos (HU-024)."
      required: [casoRelacionadoId]
      properties:
        casoRelacionadoId: { type: string }
    CierreCaso:
      type: object
      description: "Cierre del caso con estado homologado y evidencia (HU-025): sin evidencia no hay cierre (422)."
      required: [estado, evidencia]
      properties:
        estado: { type: string, description: 'Uno de los 8 estados homologados (RN-SVC-019; RF-SVC-025): conforme, con observación, con riesgo mitigado, con contingencia, por desistimiento, por derivación legal, por regularización documentaria y por acuerdo con el cliente.', x-pendiente: 'Códigos de los 8 estados: el Excel solo da los nombres.' }
        evidencia: { type: string }
        referenciaGli: { type: string, description: 'Referencia al original crítico custodiado en el GLI (HU-025 CA-02).' }
    Conflicto:
      type: object
      description: "Señal de conflicto, por ejemplo una carta notarial (HU-026)."
      required: [motivo]
      properties:
        motivo: { type: string }
    RetiroConflicto:
      type: object
      description: "Retiro de una señal marcada por error, con justificación (HU-026 CA-03)."
      required: [justificacion]
      properties:
        justificacion: { type: string }
    Handoff:
      type: object
