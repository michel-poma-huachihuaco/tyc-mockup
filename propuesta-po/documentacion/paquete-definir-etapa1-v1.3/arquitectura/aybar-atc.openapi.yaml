        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [portal]
      operationId: registrarMiTicket
      summary: "Registrar un ticket desde Mi Portal"
      description: 'Operación del cliente (rol `CUSTOMER`, ADR-011). La identidad del cliente sale solo de su token: es el `PartyID` del cliente autenticado (el token no lo trae: ATC lo obtiene del vínculo de la cuenta en la base única con `CuentaPersonaPort`, ED-01). Admite la cuenta de tipo `CUSTOMER` o el rol `CUSTOMER` y rechaza `PROSPECT`. Ningún identificador de cliente viaja en el cuerpo, la ruta ni la consulta. El cuerpo es `PortalTicketNuevo` (`additionalProperties: false`): un campo que no está en el esquema, por ejemplo `clienteId`, `partyId`, `prioridadId`, `canal` o `visible`, se rechaza con AYB-VAL-400. El servidor fija el `PartyID` del token, el canal `MI_PORTAL`, la empresa y la línea de negocio del contrato del cliente (RN-SVC-005) y la prioridad (la del flujo o la del tipo). Responde `PortalTicket` con el número y la fecha de compromiso (HU-064 CA-01). Un adjunto de más de 10 MB o de un formato no admitido responde AYB-VAL-400 con el tamaño y los formatos permitidos (HU-064 CA-05).'
      x-historias: [HU-064]
      x-estado: borrador
      x-permiso: "ATC.PORTAL + crear"
      x-roles: [CUSTOMER]
      x-errores-negocio:
        - { codigo: AYB-PTL-422, cuando: 'El tipo elegido va al Libro de Reclamaciones (reclamo o queja): se responde con el aviso legal y no se crea un ticket común (HU-064 CA-04). También cuando el cliente tiene varios contratos y no eligió `contratoId`, o el subtipo no está habilitado para Mi Portal.' }
