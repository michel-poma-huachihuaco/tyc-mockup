    "HU-ATC-067": {
      "id": "HU-ATC-067",
      "titulo": "Ver el proceso de atención en un visor 3D (operación en vivo)",
      "archivo": "historias/HU-ATC-067-ver-el-proceso-de-atencion-en-un-visor-3d-operacion-en-vivo.md",
      "estado": "draft",
      "prioridad": "Debe",
      "ui": true,
      "features": [
        "FT-ATC-25"
      ],
      "como": "supervisor ATC",
      "quiero": "ver en vivo, como una sede en 3D, cómo entran los tickets, a qué área van y cuáles están por vencer",
      "para": "detectar dónde se acumulan los casos y reasignar antes de que venza el SLA",
      "criterios": 10,
      "secciones": [
        {
          "titulo": "Resumen",
          "md": "- Ticket: (pendiente: AYB-NNNN del proyecto) - Tipo: (pendiente: T1/T2/T3) - Épica/feature: EP-ATC-09 / FT-ATC-25\n- Como supervisor ATC quiero ver en vivo, como una sede en 3D, cómo entran los tickets, a qué área van y cuáles están por vencer para detectar dónde se acumulan los casos y reasignar antes de que venza el SLA.\n\n| Traza | Prioridad | Horas | Desarrollador | Iteración | Fechas (PLT-04) | Estado |\n|---|---|---|---|---|---|---|\n| RF-SVC-067 | Debe | 10 h con IA | Dev 3 (Michel) | 1 | 23-oct-2026 → 27-oct-2026 | Pendiente DoR |\n\n**Responsable:** Dev 3 · Michel Poma Huachihuaco (PLT-01/PLT-04)\n\n**Depende de:** HU-ATC-043 (áreas de los flujos y eventos de la bandeja: PLT-03 en FT-ATC-25; PLT-04 en la ficha de HU-043 y el CA-01), HU-ATC-044 (eventos de la bandeja orquestadora: PLT-03 en FT-ATC-25 y PLT-05), HU-ATC-046 (FT-ATC-18 es predecesora de FT-ATC-25 y esta es su última HU, PLT-02; reasignación por carga en el panel del área, CA-04, PLT-04) · Dependencias externas: DEP-16 (Control de acceso, PJ-05: permisos por área, CA-07)\n\n**La necesitan:** ninguna\n\n**Requerimiento de origen:** El sistema debe mostrar en un visor 3D isométrico la sede de atención con sus áreas, los tickets entrando por los canales, pasando por la bandeja orquestadora y moviéndose al área de su flujo con su color de SLA, y el detalle de cada área y de cada ticket. Propuesta PO v1.3 · prototipo «visor del proceso 3d» (Operación en vivo)"
        },
        {
          "titulo": "Criterios de aceptación (Gherkin, verificables)",
          "md": "```gherkin\nEscenario: CA-01 · Escena de la sede (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado las áreas configuradas en los flujos (HU-043), por ejemplo Atención Eje 1, Cobranza, Libro de Reclamaciones, Postventa, Legal Eje 3, Proyecto y Entrega Fest, Sala de Comité y Cierre en Mi Portal\n  Cuando abro «Operación en vivo»\n  Entonces veo cada área como un espacio de la sede con su nombre, gestores ocupados sobre el total y tickets en cola, y los canales de recepción (teléfono, WhatsApp, web y QR) como entradas.\n\nEscenario: CA-02 · Recorrido del ticket (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado que entra un ticket por un canal\n  Cuando llega a la bandeja orquestadora\n  Entonces se ve como una caja del color de su tipo que la bandeja ordena por rayo, SLA y prioridad y que se mueve al área que indica su flujo.\n\nEscenario: CA-03 · Color del SLA (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado tickets en atención\n  Cuando cambia el tiempo restante de su SLA\n  Entonces cada ticket se ve verde (holgado), naranja (en riesgo) o rojo (vencido); al vencer, el registro de actividad muestra el correo al líder (con copia) y el caso aparece en la Sala de Comité.\n\nEscenario: CA-04 · Panel del área (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado la escena cargada\n  Cuando toco un área\n  Entonces veo en un panel: en cola, gestores ocupados, resueltos y % en SLA, la lista de sus tickets y la carga de cada gestor con la reasignación por carga (HU-046).\n\nEscenario: CA-05 · Seguimiento del ticket (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado la escena cargada\n  Cuando toco un ticket\n  Entonces veo su línea de tiempo (registrado, en bandeja, asignado, en atención, resuelto y cerrado) con hora de cada paso, el SLA consumido y el CSAT si ya fue cerrado.\n\nEscenario: CA-06 · Indicadores y actividad (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado que abro el visor\n  Cuando carga la escena\n  Entonces veo arriba los tickets activos, los resueltos en SLA frente a la meta del 90 % y el CSAT del día, y a la derecha el registro de actividad con la hora de cada evento.\n\nEscenario: CA-07 · Filtro y permisos (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado que filtro por razón social o tengo permiso solo para algunas áreas\n  Cuando aplico el filtro\n  Entonces el visor muestra solo esas áreas y tickets; los demás no aparecen (RN-SVC-036).\n\nEscenario: CA-08 · Tiempo real (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado un cambio de estado en la bandeja\n  Cuando ocurre\n  Entonces el visor lo refleja en 5 s o menos sin recargar la página; pausa y velocidad (x1, x2) solo existen en el modo simulación.\n\nEscenario: CA-09 · Vista alternativa (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado un equipo sin aceleración gráfica o un usuario con lector de pantalla\n  Cuando abro el visor\n  Entonces puedo cambiar a una vista 2D en lista con la misma información por área.\n\nEscenario: CA-10 · Equipo, no individuos (agregado por PO · prototipo «visor del proceso 3d»)\n  Dado que el equipo resuelve tickets dentro del SLA\n  Cuando se actualiza el marcador\n  Entonces suben el nivel y los puntos del equipo; no se muestra ranking individual entre gestores.\n```"
        },
        {
          "titulo": "Reglas de negocio",
          "md": "- RN-SVC-031 prioridad rayo controlada\n- RN-SVC-033 reasignación por menor carga\n- RN-SVC-035 aviso al líder\n- RN-SVC-036 permisos\n\n**Fuera de alcance:** Editar flujos o reasignar desde el visor (se hace en la bandeja); realidad virtual; ranking individual."
        },

/* ===================== utilidades ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const recorta=(s,n)=>{s=String(s??"");return s.length>n?s.slice(0,n-1).trimEnd()+"…":s;};

/* Markdown mínimo y seguro: se escapa TODO primero y solo después se dan
   formato a las marcas, así ningún texto del paquete llega como HTML. */
function mdEnLinea(t,base){
  let s=esc(t);
  const codigos=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codigos.push(c);return "\u0000"+(codigos.length-1)+"\u0000";});
  s=s.replace(/&lt;br\s*\/?&gt;/gi,"<br>");
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,url)=>{
    const href=enlace(url,base);
    return href?`<a class="lnk" href="${href}" target="_blank" rel="noopener">${txt}</a>`:txt;
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,"$1<em>$2</em>").replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g,"$1<em>$2</em>");
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${codigos[+i]}</code>`);
  return s;
}
/* Enlaces: http(s), mailto o rutas relativas al documento (se resuelven contra
   docs/, donde vive esta página). Nada de javascript: ni data:. Acepta la url
   escapada (desde mdEnLinea) o en claro, y la devuelve escapada para un atributo. */
function enlace(url,base){
  const u=String(url).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
  if(/^(https?:|mailto:)/i.test(u)) return esc(u);
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return null;
  if(u.startsWith("#")) return null;
  const partes=(base?base.split("/").slice(0,-1):[]).concat(u.split("/"));
  const r=[];
  for(const p of partes){ if(p===""||p===".") continue; if(p==="..") r.pop(); else r.push(p); }
  return esc(r.join("/"));
}
function celdas(l){
  let s=l.trim(); if(s.startsWith("|")) s=s.slice(1); if(s.endsWith("|")&&!s.endsWith("\\|")) s=s.slice(0,-1);
  const out=[]; let c="", cod=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(ch==="\\"&&s[i+1]==="|"){c+="|";i++;continue;}
    if(ch==="`") cod=!cod;
    if(ch==="|"&&!cod){out.push(c.trim());c="";continue;}
    c+=ch;}
  out.push(c.trim()); return out;
}
function md(texto,base){
  const L=String(texto??"").replace(/\r/g,"").split("\n");
  let h="", i=0;
  const esSep=l=>/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  const esLista=l=>/^\s*([-*+]|\d+[.)])\s+/.test(l);
  while(i<L.length){
    const l=L[i];
    if(/^\s*$/.test(l)){i++;continue;}
    let m;
    if((m=l.match(/^\s*(```|~~~)/))){
      const cierre=m[1]; const b=[]; i++;
      while(i<L.length&&!L[i].trim().startsWith(cierre)){b.push(L[i]);i++;}
      i++; h+=`<pre><code>${esc(b.join("\n"))}</code></pre>`; continue;
    }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){const n=Math.min(6,m[1].length+2);h+=`<h${n}>${mdEnLinea(m[2].replace(/\s#+$/,""),base)}</h${n}>`;i++;continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){h+="<hr>";i++;continue;}
    if(l.trim().startsWith("|")&&i+1<L.length&&esSep(L[i+1])){
      const cab=celdas(l); i+=2; const filas=[];
      while(i<L.length&&L[i].trim().startsWith("|")){filas.push(celdas(L[i]));i++;}
      h+=`<div class="tabla"><table><thead><tr>${cab.map(c=>`<th>${mdEnLinea(c,base)}</th>`).join("")}</tr></thead><tbody>${
        filas.map(f=>`<tr>${cab.map((_,k)=>`<td>${mdEnLinea(f[k]??"",base)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(l.trim().startsWith("|")){
      const filas=[]; while(i<L.length&&L[i].trim().startsWith("|")){if(!esSep(L[i])) filas.push(celdas(L[i]));i++;}
      h+=`<div class="tabla"><table><tbody>${filas.map(f=>`<tr>${f.map(c=>`<td>${mdEnLinea(c,base)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,""));i++;}
      h+=`<blockquote>${md(b.join("\n"),base)}</blockquote>`;continue;}
    if(esLista(l)){
      const ord=/^\s*\d+[.)]\s+/.test(l); const items=[];
      while(i<L.length&&(esLista(L[i])||(/^\s{2,}\S/.test(L[i])&&items.length))){
        if(esLista(L[i])) items.push(L[i].replace(/^\s*([-*+]|\d+[.)])\s+/,""));
        else items[items.length-1]+=" "+L[i].trim();
        i++;
      }
      const tag=ord?"ol":"ul";
      h+=`<${tag}>${items.map(x=>`<li>${mdEnLinea(x.replace(/^\[( |x|X)\]\s+/,(m,c)=>c===" "?"☐ ":"☑ "),base)}</li>`).join("")}</${tag}>`;
      continue;
    }
    const p=[];
    while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,6})\s/.test(L[i])&&!/^\s*(```|~~~)/.test(L[i])&&!L[i].trim().startsWith("|")&&!/^\s*>/.test(L[i])&&!(esLista(L[i])&&p.length===0)){
      if(esLista(L[i])) break;
      p.push(L[i].trim()); i++;
    }
    if(p.length) h+=`<p>${mdEnLinea(p.join(" "),base)}</p>`; else i++;
  }
  return h;
}

  prios.forEach(p=>r.push(["p:"+p,p]));

  if(F.some(f=>f._abiertos)) r.push(["frenada","Con bloqueantes abiertos"]);

  return r;

function pasaFt(f){
  if(q && !f._busca.includes(q)) return false;
  if(filtro.startsWith("p:")) return f.prioridad===filtro.slice(2);

}

const SIN_FLUJOS=`<div class="caja"><h2>Este paquete todavía no tiene flujos de trabajo</h2>
  <p>Un flujo cuenta un proceso del negocio paso a paso —qué lo dispara, qué pasa en cada paso, qué puede fallar y con qué termina— y cita las funcionalidades e historias que cubren cada paso.</p>
  <p>Se escriben en <code>docs/flujos/flujos.json</code> (esquema <code>flujos.schema.json</code> del contrato del paquete). Los propone el agente <code>analista-paquete</code> a partir de los procesos que ya documenta el paquete, y los revisa una persona. Después se regenera esta página con <code>aybar paquete explorador</code>.</p>
  <p>Mientras tanto, entra por <button type="button" class="chip" data-ir="fts">Funcionalidades</button>.</p></div>`;

function pintaLista(){
  let h="";
  if(modo==="flujos"){
    if(!FLUJOS.length){
      $("#lista").innerHTML=`<div class="sin">Sin flujos de trabajo todavía: van en <code>docs/flujos/flujos.json</code>.</div>`;
      $("#cuenta")&&($("#cuenta").textContent="");
    } else {
      const vis=FLUJOS.filter(pasaFl);
      const g=new Map(); vis.forEach(f=>{const k=f.grupo||"FLUJOS";if(!g.has(k))g.set(k,[]);g.get(k).push(f);});
      g.forEach((lista,k)=>{
        h+=`<div class="grp">${esc(k)}</div>`;
        lista.forEach(fl=>{const e=estadoFlujo(fl);
          h+=`<button type="button" class="it" data-k="fl" data-id="${esc(fl.id)}" aria-current="${fl.id===sel}">
            <span class="nm">${esc(fl.nombre)}</span>${fl.resumen?`<span class="de">${esc(fl.resumen)}</span>`:""}
            <span class="meta"><span class="tag t-capa">${fl.pasos.length} pasos</span>
            <span class="tag ${e.c}">${esc(e.t)}</span>${fl._fallas?`<span class="tag t-nord">${fl._fallas} sin decidir</span>`:""}</span></button>`;
        });
      });
      $("#lista").innerHTML=h||`<div class="sin">Nada coincide.</div>`;
      $("#cuenta")&&($("#cuenta").textContent=`${vis.length} de ${FLUJOS.length}`);
    }
  } else {
    const vis=F.filter(pasaFt);
    const g={}; vis.forEach(f=>{const k=f.epica||"~";(g[k]=g[k]||[]).push(f);});
    Object.keys(g).sort().forEach(e=>{
      h+=e==="~"?`<div class="grp">SIN ÉPICA</div>`:`<div class="grp">${esc(e)}<span class="n">${esc((EP[e]||{}).titulo||"")}</span></div>`;
      g[e].forEach(f=>{const v=ver(f);
        h+=`<button type="button" class="it" data-k="ft" data-id="${esc(f.id)}" aria-current="${f.id===sel}">
          <span class="id">${esc(f.id)}</span><span class="nm">${esc(f.nombre)}</span>
          <span class="meta">${f.prioridad?`<span class="tag ${tagPrio(f.prioridad)}">${esc(f.prioridad)}</span>`:""}
          ${f.release?`<span class="tag t-capa">${esc(recorta(f.release,18))}</span>`:""}
          <span class="tag ${v.c}"${f.dor?.origen==="propuesta-ia"?' title="Propuesta de la IA: el PO todavía no decide"':""}>${esc(v.corto)}${f.dor?.origen==="propuesta-ia"?" · IA":""}</span>
          ${f.ui?'<span class="tag t-capa">pantallas</span>':""}</span></button>`;
      });
    });
    $("#lista").innerHTML=h||`<div class="sin">${F.length?"Nada coincide.":"El paquete no tiene features en <code>docs/features/</code>."}</div>`;
    $("#cuenta")&&($("#cuenta").textContent=`${vis.length} de ${F.length}`);
  }
  $$(".it").forEach(b=>b.onclick=()=>b.dataset.k==="fl"?abreFlujo(b.dataset.id):abreFt(b.dataset.id));
  const v=$("#vacio");
  if(v){
    v.innerHTML = !D ? `<div class="caja"><h2>Sin datos</h2><p>Esta es la plantilla del explorador. La genera <code>aybar paquete explorador</code> con los datos del <code>docs/</code> del servicio.</p></div>`
      : modo==="flujos"
        ? (FLUJOS.length?"Elige un flujo de trabajo.<br>Verás sus pasos en orden, qué funcionalidad cubre cada uno<br>y qué queda sin decidir.":SIN_FLUJOS)
        : "Elige una funcionalidad.<br>Verás qué se va a hacer, cómo, cuánto trabajo es y qué la frena.";
    $$("[data-ir]",v).forEach(b=>b.onclick=()=>cambiaModo(b.dataset.ir));
  }
}

function cambiaModo(m){
  modo=m; filtro="todo"; sel=null; pintaModo();
  $("#detalle").innerHTML=`<div id="vacio"></div>`;
  pintaFiltros(); pintaLista(); marca("");
}
function enlaza(){
  $$("#detalle button.chip[data-ft]").forEach(b=>b.onclick=()=>{
    if(modo!=="fts"){modo="fts"; filtro="todo"; pintaModo(); pintaFiltros(); pintaLista();}
    abreFt(b.dataset.ft);});
  $$("#detalle [data-fl]").forEach(b=>b.onclick=()=>{
    if(modo!=="flujos"){modo="flujos"; filtro="todo"; pintaModo(); pintaFiltros(); pintaLista();}
    abreFlujo(b.dataset.fl);});
}
function marca(h){ try{ history.replaceState(null,"",h?"#"+h:location.pathname+location.search); }catch(e){} }

/* ===================== detalle de un flujo ===================== */
function abreFlujo(id){
  const fl=FLUJOS.find(x=>x.id===id); if(!fl) return;
  sel=id; marca("flujo="+encodeURIComponent(id));
  $$(".it").forEach(b=>b.setAttribute("aria-current",String(b.dataset.id===id)));
  const fs=fl._fts.map(byId).filter(Boolean);
  const cas=fs.reduce((a,f)=>a+f._casos,0), hus=new Set(fs.flatMap(f=>f.hus)).size;
  const sinEst=fs.reduce((a,f)=>a+f._sinEstimar,0);
  const e=estadoFlujo(fl);
  const origen=DD.flujos_origen||{};
  let n=0;
  $("#detalle").innerHTML=`
  <div class="dh">
    <div class="bc">FLUJO DE TRABAJO${fl.grupo?" · "+esc(fl.grupo):""}</div>
    <h2>${esc(fl.nombre)}</h2>
    <div class="meta">
      <span class="tag t-capa">${fl.pasos.length} pasos</span>
      <span class="tag t-capa">${fl._total} funcionalidades</span>
      <span class="tag ${e.c}">${esc(e.t)}</span>
    </div>
  </div>
  ${fl.disparador||fl.resultado?`<div class="de-a">
    <div class="b"><span class="l">EMPIEZA CUANDO</span><span class="v">${esc(fl.disparador||"—")}</span></div>
    <div class="ar" aria-hidden="true">→</div>
    <div class="b"><span class="l">TERMINA CON</span><span class="v">${esc(fl.resultado||"—")}</span></div>
  </div>`:""}
  <section class="blk">
    <h3><span class="num">${++n}</span>LOS PASOS, EN ORDEN</h3>
    ${fl.pasos.map((p,i)=>`
      <div class="paso ${p.falla?"ko":""}">
        <span class="mk">${i+1}</span>
        <h4>${esc(p.t)}</h4>
        ${p.q?`<p class="q">${esc(p.q)}</p>`:""}
        ${p.falla?`<p class="falla"><strong>Ojo:</strong> ${esc(p.falla)}</p>`:""}
        <div class="chips">${p.ft.length?`<span class="et">LO CUBRE</span>${p.ft.map(x=>byId(x)
          ?`<button type="button" class="chip" data-ft="${esc(x)}">${esc(x)} · ${esc(recorta(byId(x).nombre,32))}</button>`
          :`<span class="chip ko" title="No hay documento con este id en features/">${esc(x)} · no existe</span>`).join("")}`
          :`<span class="et">SIN FUNCIONALIDAD ASIGNADA TODAVÍA</span>`}</div>
        ${p.hu.length?`<div class="chips" style="margin-top:5px"><span class="et">HISTORIAS</span>${p.hu.map(x=>`<span class="chip e${HU[x]?"":" ko"}" title="${esc((HU[x]||{}).titulo||"No hay documento con este id en historias/")}">${esc(x)}</span>`).join("")}</div>`:""}
      </div>`).join("")}
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>CUÁNTO PESA ESTE FLUJO</h3>
    <div class="cards">
      <div class="card"><h4>FUNCIONALIDADES</h4><div class="v">${fl._total}</div></div>
      <div class="card"><h4>HISTORIAS</h4><div class="v">${hus}</div></div>
      <div class="card"><h4>TAREAS TÉCNICAS</h4><div class="v">${fl._tareas}${sinEst?` <small>${sinEst} sin estimar</small>`:""}</div></div>
      <div class="card"><h4>CASOS DE PRUEBA</h4><div class="v">${cas}</div></div>
    </div>
    <p class="nota">Las cifras suman las funcionalidades que el flujo toca; una misma funcionalidad puede aparecer en varios flujos.</p>
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>LAS FUNCIONALIDADES QUE LO SOSTIENEN</h3>
    <div class="tabla"><table>
      <thead><tr><th style="width:110px">Cuál</th><th>Qué hace</th><th style="width:118px">Prioridad</th><th style="width:130px">¿Puede empezar?</th></tr></thead>
      <tbody>${fs.map(f=>{const v=ver(f);return `<tr>
        <td><button type="button" class="chip" data-ft="${esc(f.id)}">${esc(f.id)}</button></td>
        <td>${esc(f.nombre)}</td>
        <td>${f.prioridad?`<span class="tag ${tagPrio(f.prioridad)}">${esc(f.prioridad)}</span>`:"—"}</td>
        <td><span class="tag ${v.c}">${esc(v.corto)}${f.dor?.origen==="propuesta-ia"?" · IA":""}</span></td></tr>`;}).join("")||`<tr><td colspan="4">Ninguna asignada todavía.</td></tr>`}</tbody>
    </table></div>
  </section>
  ${fl._fallas?`<section class="blk">
    <h3><span class="num">${++n}</span>LO QUE FALTA DECIDIR EN ESTE FLUJO</h3>
    <ol class="preg">${fl.pasos.filter(p=>p.falla).map(p=>`<li><strong>${esc(p.t)}.</strong> ${esc(p.falla)}</li>`).join("")}</ol>
  </section>`:""}
  <section class="blk">
    <h3><span class="num">${++n}</span>DE DÓNDE SALE ESTE FLUJO</h3>
    <p class="txt">${fl.fuente?`Es una lectura de <strong>${esc(fl.fuente)}</strong>. `:""}Está escrito en <code>${esc(origen.archivo||"flujos/flujos.json")}</code>: los pasos resumen el proceso en lenguaje de negocio; el detalle técnico, con todas sus ramas de error, está en los documentos del paquete.</p>
    ${origen.generado_por_ia&&!origen.revisado_por?`<p class="nota">Lo propuso la IA y nadie lo ha revisado todavía (<code>revisado_por: null</code>).</p>`:origen.revisado_por?`<p class="nota">Revisado por ${esc(origen.revisado_por)}.</p>`:""}
  </section>
  <div class="pie">${pie()}</div>`;
  enlaza(); $("#detalle").scrollTop=0;
}

/* ===================== detalle de una funcionalidad ===================== */
function secciones(lista,base,abiertas){
  return (lista||[]).map((s,i)=>`<details class="sec"${i<abiertas?" open":""}><summary>${esc(s.titulo)}</summary><div class="md">${md(s.md,base)||'<p>(vacía)</p>'}</div></details>`).join("");
}
function abreFt(id){
  const f=byId(id); if(!f) return;
  sel=id; marca("ft="+encodeURIComponent(id));
  $$(".it").forEach(b=>b.setAttribute("aria-current",String(b.dataset.id===id)));
  const bl=f.dor?.bloqueantes||[];
  const v=ver(f);
  const enFlujos=FLUJOS.filter(fl=>fl._fts.includes(id));
  const hus=f.hus.map(h=>{
    const u=HU[h]||{}, t=TAR[h]||{n:0,capas:{}}, c=CAS[h]||0;
    const capas=Object.entries(t.capas||{}).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,x])=>`<span class="chip e">${esc(k)} ${x}</span>`).join(" ");
    return `<div class="hu">
      <div class="h"><span class="id">${esc(h)}</span><span class="t">${esc(u.titulo||"(sin documento en historias/)")}</span>
        ${u.prioridad?`<span class="tag ${tagPrio(u.prioridad)}">${esc(u.prioridad)}</span>`:""}${u.ui?'<span class="tag t-capa">pantalla</span>':""}</div>
      ${u.como?`<p class="n">Como <em>${esc(u.como)}</em> quiero ${esc(u.quiero||"")}${u.para?" para "+esc(u.para):""}.</p>`:""}
      <div class="nums">${u.criterios!=null?`<span>${u.criterios} criterios</span>`:""}<span>${t.n} tareas${t.sin_estimar?` (${t.sin_estimar} sin estimar)`:t.n?` · ${+t.horas} h`:""}</span><span>${c} casos</span></div>
      ${capas?`<div class="chips" style="margin-top:6px">${capas}</div>`:""}
      ${u.secciones?.length?`<details class="hu-mas"><summary>Leer la historia</summary>${secciones(u.secciones,u.archivo,0)}</details>`:""}</div>`;}).join("");
  const horasTxt=f._tareas?(f._sinEstimar?`${f._sinEstimar} sin estimar`:`${+f._horas.toFixed(2)} h`):"";
  let n=0;

  $("#detalle").innerHTML=`
  <div class="dh">
    ${enFlujos.length?`<button type="button" class="volver" data-fl="${esc(enFlujos[0].id)}">← Volver al flujo «${esc(enFlujos[0].nombre)}»</button><br>`:""}
    <div class="bc">${f.epica?esc(f.epica)+" · "+esc((EP[f.epica]||{}).titulo||""):"Sin épica"}</div>
    <h2>${esc(f.nombre)}</h2>
    <div class="meta">
      <span class="tag t-capa">${esc(f.id)}</span>
      ${f.prioridad?`<span class="tag ${tagPrio(f.prioridad)}">${esc(f.prioridad)}</span>`:""}
      ${f.release?`<span class="tag t-capa" title="${esc(f.release)}">${esc(recorta(f.release,60))}</span>`:""}
      ${f.estado?`<span class="tag t-podria">documento ${esc(f.estado)}</span>`:""}
      ${f.ui?'<span class="tag t-capa">Con pantallas</span>':""}
      <span class="tag ${v.c}">${esc(v.largo)}${f.dor?.origen==="propuesta-ia"?" (propuesta IA)":""}</span>
    </div>
  </div>
  ${enFlujos.length?`<section class="blk"><h3><span class="num">·</span>EN QUÉ FLUJOS APARECE</h3>
    <div class="chips">${enFlujos.map(fl=>`<button type="button" class="chip" data-fl="${esc(fl.id)}">${esc(fl.nombre)}</button>`).join("")}</div></section>`:""}
  <section class="blk">
    <h3><span class="num">${++n}</span>QUÉ SE VA A HACER · NEGOCIO</h3>
    ${f.secciones?.length?secciones(f.secciones,f.archivo,2):`<p class="txt">La feature no tiene texto todavía.</p>`}
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>CÓMO SE VA A HACER · TÉCNICO</h3>
    <div class="cards">
      <div class="card"><h4>DATOS QUE TOCA</h4>${f.entidades.length?`<div class="chips">${f.entidades.map(e=>`<span class="chip">${esc(e)}</span>`).join("")}</div>`:`<p class="txt">Ninguna entidad de <code>datos/</code> citada.</p>`}</div>
      <div class="card"><h4>POR DÓNDE SE LLAMA</h4>${f.endpoints.length?`<div class="chips">${f.endpoints.slice(0,12).map(e=>`<span class="chip e">${esc(e)}</span>`).join("")}</div>${f.endpoints.length>12?`<p class="nota">y ${f.endpoints.length-12} más</p>`:""}`:`<p class="txt">Sin rutas citadas todavía: entran con el contrato de API (G3).</p>`}</div>
      <div class="card"><h4>DECISIONES QUE LA SOSTIENEN</h4>${f.adrs.length?`<div class="chips">${f.adrs.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>`:`<p class="txt">Ningún ADR citado.</p>`}</div>
    </div>
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>CUÁNTO TRABAJO ES</h3>
    <div class="cards">
      <div class="card"><h4>HISTORIAS</h4><div class="v">${f.hus.length}</div></div>
      <div class="card"><h4>CRITERIOS</h4><div class="v">${f._crit}</div></div>
      <div class="card"><h4>TAREAS</h4><div class="v">${f._tareas}${horasTxt?` <small>${esc(horasTxt)}</small>`:""}</div></div>
      <div class="card"><h4>CASOS DE PRUEBA</h4><div class="v">${f._casos}</div></div>
    </div>
    <h4 class="sub">LAS HISTORIAS, UNA A UNA</h4>
    ${hus||`<p class="txt">Ninguna historia la cita como suya todavía.</p>`}
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>QUÉ LA FRENA</h3>
    ${!f.dor?`<p class="txt">No tiene DoR (<code>dor/DOR-${esc(f.id)}…md</code>): nadie ha evaluado todavía si puede entrar a desarrollo.</p>`
      :`<p class="txt">${f.dor.veredicto?(f.dor.origen==="propuesta-ia"
          ?`Su DoR trae una <strong>propuesta de la IA: ${esc(f.dor.veredicto)}</strong>. Lo decide el PO, y todavía no lo ha hecho.`
          :`El PO la declaró <strong>${esc(f.dor.veredicto)}</strong>.`):"Su DoR no tiene veredicto todavía."}</p>`}
    ${bl.length?`<div class="tabla"><table>
      <thead><tr><th style="width:92px">Qué</th><th>De qué se trata</th><th style="width:96px">Dueño</th><th style="width:102px">Fecha</th><th style="width:110px">Estado</th></tr></thead>
      <tbody>${bl.map(b=>`<tr><td class="k">${esc(b.id)}</td><td>${mdEnLinea(recorta(b.que,320),f.dor.archivo)}</td><td>${esc(b.dueno||"—")}</td><td>${esc(b.fecha||"—")}</td>
        <td><span style="font:600 11px var(--mono);color:${abierto(b)?"var(--carmine)":"var(--green)"}">${esc(b.estado||"—")}</span></td></tr>`).join("")}</tbody></table></div>
      <p class="nota">${f._abiertos} de ${bl.length} siguen abiertos. Una fecha «requerida» no es una fecha comprometida por su dueño.</p>`
      :f.dor?`<p class="txt">Su DoR no lista bloqueantes ni dependencias.</p>`:""}
  </section>
  <section class="blk">
    <h3><span class="num">${++n}</span>DÓNDE LEER MÁS</h3>
    <div class="chips"><a class="chip e" href="${enlace(f.archivo,"")}" target="_blank" rel="noopener">${esc(f.archivo)}</a>${
      f.hus.filter(h=>HU[h]).map(h=>`<a class="chip e" href="${enlace(HU[h].archivo,"")}" target="_blank" rel="noopener">${esc(HU[h].archivo)}</a>`).join("")}${
      f.dor?`<a class="chip e" href="${enlace(f.dor.archivo,"")}" target="_blank" rel="noopener">${esc(f.dor.archivo)}</a>`:""}</div>
  </section>
  <div class="pie">${pie()}</div>`;
  enlaza(); $("#detalle").scrollTop=0;
}

function pie(){
  return `Generado por <code>aybar paquete explorador</code> desde el <code>docs/</code> del servicio${CAB.fecha?", con documentos hasta el "+esc(CAB.fecha):""}. No se edita a mano: se regenera.`;
}

/* ===================== arranque ===================== */
$$("#modo button").forEach(b=>b.onclick=()=>cambiaModo(b.dataset.m));
$("#buscar").oninput=e=>{q=e.target.value.trim().toLowerCase();pintaLista();};
pintaModo(); pintaFiltros(); pintaLista();
(function(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  const m=h.match(/^(flujo|ft)=(.+)$/); if(!m) return;
  if(m[1]==="flujo"&&FLUJOS.some(x=>x.id===m[2])){ if(modo!=="flujos") cambiaModo("flujos"); abreFlujo(m[2]); }
  else if(m[1]==="ft"&&byId(m[2])){ if(modo!=="fts") cambiaModo("fts"); abreFt(m[2]); }
})();
</script>
</body>
</html>
