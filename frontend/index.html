<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Antes que nada más, el arranque de la apariencia (@aybarcorp/tokens): aplica en <html>
      el tema que el usuario eligió y recordó este navegador, antes del primer pintado, para
      que al recargar no destelle el tema por defecto. Es un script clásico y bloqueante a
      propósito, y del mismo origen: vite.config.ts lo sirve en desarrollo y lo copia a dist/.
      vite-ignore le dice a Vite que no intente empaquetarlo (lo deja tal cual y quita el
      atributo).
    -->
    <script vite-ignore src="/aybar-apariencia.js"></script>
    <!--
      Sin preferencia recordada ni data-theme en <html>, la página sigue el tema del sistema
      (prefers-color-scheme); el selector de tema elige claro, oscuro o según el sistema.
      color-scheme hace que los controles nativos y las barras de scroll cambien con ella.
    -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sin hojas de fuentes de terceros: Figtree y Montserrat 600-800 se sirven desde la
      aplicación (src/fuentes.css). Como package.json declara @fontsource/*, aybar-front init
      no añade la hoja de fuentes por CDN de @aybarcorp/tokens.
    -->
    <title>tyc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
