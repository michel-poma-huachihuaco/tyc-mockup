# Servidor estatico del frontend. La imagen base (nginx-unprivileged) corre sin
# root, y por eso escucha en 8080 y no en 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin version de nginx en las paginas de error ni en la cabecera Server.
    server_tokens off;

    # --- Cabeceras de seguridad basicas ------------------------------------
    # OJO con nginx: un add_header dentro de un location ANULA todos los del
    # server. Por eso los location de abajo solo usan "expires" (no es
    # add_header) y estas cabeceras llegan a todas las respuestas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nadie embebe esta aplicacion en un iframe. Si un ADR lo pide, se cambia
    # aqui y en el frame-ancestors de la CSP.
    add_header X-Frame-Options "DENY" always;

    # --- Content-Security-Policy de partida (COMENTADA a proposito) --------
    # Una CSP que no conoce los origenes reales rompe la aplicacion sin un
    # error legible, y esos origenes los decide cada servicio (su ADR): la
    # API, el emisor OIDC y, en un shell, el CDN de los remotos. Antes de
    # activarla:
    #   - connect-src: el origen de la API y el del emisor OIDC (discovery,
    #     token y renovacion se piden por fetch);
    #   - shell: script-src necesita el origen del CDN de los remotos y el
    #     hash 'sha256-...' del <script type="importmap"> en linea de
    #     index.html (o un nonce); sin el, el navegador ignora el import map
    #     y ningun remoto carga;
    #   - script-src 'self' cubre el arranque de la apariencia del <head>
    #     (aybar-apariencia.js): es un archivo del mismo origen, no un
    #     script en linea;
    #   - Angular: la plantilla deja inlineCritical en false en angular.json.
    #     Con estilos criticos en linea, la hoja se carga con un script en
    #     linea que la CSP bloquea (y el tema oscuro destella al recargar);
    #   - fuentes: Figtree y Montserrat 600-800 las sirve la propia aplicacion
    #     (@fontsource, en dist/): basta font-src 'self'. Como package.json
    #     declara @fontsource/*, aybar-front init no agrega la hoja de fuentes
    #     por CDN de @aybarcorp/tokens (fonts.googleapis.com).
    # Pruebala primero como Content-Security-Policy-Report-Only.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.example.invalid https://emisor.example.invalid; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # index.html nunca se cachea: es lo que apunta a los archivos con hash
    # de la version desplegada.
    location = /index.html {
        expires -1;
    }

    # Archivos con hash en el nombre (los emiten Vite y Angular): inmutables.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$" {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: toda ruta que no es un archivo la resuelve el router del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
